name: App feedback
description: Share a problem, idea, or confusing part of the DartPDF app.
title: "[App feedback]: "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve DartPDF. You do not need to know any technical details. Fill in what you can, and skip anything that does not apply.
  - type: dropdown
    id: feedback_type
    attributes:
      label: What kind of feedback is this?
      options:
        - Something is not working
        - Something is confusing
        - I have an idea or request
        - The app is slow or hangs
        - A PDF looks wrong
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened, or what would you like to happen?
      description: A short plain-language description is enough.
      placeholder: |
        Example: I tried to erase two ink marks, but only the first one changed.
        Example: I expected the recent files list to appear in the menu.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What were you doing?
      description: If you can, list the clicks or actions that led to this.
      placeholder: |
        1. Opened a PDF
        2. Selected the eraser
        3. Dragged across two ink marks
        4. Only one mark changed
  - type: dropdown
    id: platform
    attributes:
      label: Where did this happen?
      multiple: true
      options:
        - macOS app
        - Windows app
        - Linux app
        - Web app
        - iPad / iPhone
        - Android
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: If you can find it, enter the version number. Otherwise write "not sure".
      placeholder: "1.3.2, latest, or not sure"
  - type: textarea
    id: pdf
    attributes:
      label: Does it happen with a specific PDF?
      description: Do not upload confidential files. A screenshot, page number, or description is still useful.
      placeholder: |
        It happens on page 4 of a marked-up drawing.
        The PDF is scanned / signed / from Bluebeam / from OneDrive / not sure.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag screenshots or a short recording here if they help explain the issue.
  - type: textarea
    id: anything_else
    attributes:
      label: Anything else?
      description: Add anything that might help. It is fine to leave this blank.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: The app fills this in automatically when you use "Supply feedback…". It lists the app version, your platform, and any errors from this session - no document contents. You can edit or clear it before submitting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have not attached confidential or private documents.
          required: true
