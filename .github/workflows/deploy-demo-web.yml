name: Deploy Demo Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-demo-web.yml
      - pubspec.yaml
      - packages/pdf_cos/**
      - packages/pdf_document/**
      - packages/pdf_graphics/**
      - packages/dart_pdf_editor/**

concurrency:
  group: demo-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - run: flutter pub get

      # Compile the dedicated Web Worker that runs page interpretation + image
      # decode off the UI thread. Without it the viewer silently falls back to
      # on-thread rendering, so heavy PDFs hang the demo while scrolling.
      - name: Build the render worker
        working-directory: packages/dart_pdf_editor/example
        run: dart run dart_pdf_editor:build_web_worker

      # Default (no --wasm) builds the CanvasKit renderer, which benchmarks
      # faster than skwasm for page rasterization (see benchmark/web). The
      # render worker above keeps interpretation/decode off the UI thread
      # regardless of renderer; firebase.json's COOP/COEP headers are kept
      # (harmless for CanvasKit) but no longer required for the renderer.
      - run: flutter build web --release
        working-directory: packages/dart_pdf_editor/example

      - name: Cache-bust web build
        run: bash tool/web_cache_bust.sh packages/dart_pdf_editor/example/build/web

      - uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DART_PDF_DEMO }}
          projectId: dart-pdf-demo
          channelId: live
          entryPoint: packages/dart_pdf_editor/example
