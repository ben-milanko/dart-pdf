name: Preview Demo Web

on:
  pull_request:
    paths:
      - .github/workflows/preview-demo-web.yml
      - pubspec.yaml
      - packages/pdf_cos/**
      - packages/pdf_document/**
      - packages/pdf_graphics/**
      - packages/dart_pdf_editor/**
      - tool/patrol_perf_summary.dart

concurrency:
  group: demo-web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FIREBASE_TOOLS_VERSION: 15.22.4
  PATROL_CLI_VERSION: 4.7.0
  PATROL_ANALYTICS_ENABLED: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      # Compile the off-thread render worker, then build with the CanvasKit
      # renderer (matches the live demo deploy - see deploy-demo-web.yml).
      - name: Build the render worker
        working-directory: packages/dart_pdf_editor/example
        run: dart run dart_pdf_editor:build_web_worker

      - run: flutter build web --release
        working-directory: packages/dart_pdf_editor/example

      - name: Cache-bust web build
        run: bash tool/web_cache_bust.sh packages/dart_pdf_editor/example/build/web

      - name: Stage static preview artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/demo-preview/build"
          cp -R packages/dart_pdf_editor/example/build/web "$RUNNER_TEMP/demo-preview/build/web"

      - uses: actions/upload-artifact@v7
        with:
          name: demo-web-preview
          path: ${{ runner.temp }}/demo-preview
          if-no-files-found: error

      # Continue into the browser E2E journey on the same runner so Patrol
      # reuses this job's checkout, Flutter toolchain, and resolved workspace.
      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli "$PATROL_CLI_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Run Patrol on web
        id: patrol-web
        working-directory: packages/dart_pdf_editor/example
        shell: bash
        run: |
          set -o pipefail
          patrol test \
            --device chrome \
            --target patrol_test/demo_e2e_test.dart \
            --dart-define PDF_PERF_LOG=true \
            --dart-define PDF_BUILD_COMMIT=${{ github.event.pull_request.head.sha }} \
            --show-flutter-logs \
            --web-headless \
            --web-locale en-US \
            --web-workers 1 \
            --web-video retain-on-failure \
            --verbose \
            2>&1 | tee "$RUNNER_TEMP/patrol-web.log"

      - name: Run Patrol performance scenario
        id: patrol-perf
        working-directory: packages/dart_pdf_editor/example
        shell: bash
        run: |
          set -o pipefail
          patrol test \
            --device chrome \
            --target patrol_test/perf_e2e_test.dart \
            --dart-define PDF_PERF_LOG=true \
            --dart-define PDF_BUILD_COMMIT=${{ github.event.pull_request.head.sha }} \
            --show-flutter-logs \
            --web-headless \
            --web-locale en-US \
            --web-workers 1 \
            --web-viewport '{"width":2600,"height":2600}' \
            --web-video retain-on-failure \
            --verbose \
            2>&1 | tee -a "$RUNNER_TEMP/patrol-web.log"

      - name: Download latest main Patrol web baseline
        id: patrol-baseline
        if: always()
        working-directory: packages/dart_pdf_editor/example
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t baseline_runs < <(gh run list \
            --workflow patrol-e2e.yml \
            --branch main \
            --event push \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId')
          for baseline_run in "${baseline_runs[@]}"; do
            destination="$RUNNER_TEMP/patrol-baseline/$baseline_run"
            if gh run download "$baseline_run" \
              --name patrol-web-results \
              --dir "$destination"; then
              json="$destination/test-results/perf/patrol-perf.json"
              if [[ -f "$json" ]]; then
                echo "json=$json" >> "$GITHUB_OUTPUT"
                echo "Using Patrol web baseline from run $baseline_run"
                exit 0
              fi
            fi
          done
          echo "::notice::No usable main Patrol web artifact is available yet"

      - name: Collect Patrol performance trace
        if: always()
        working-directory: packages/dart_pdf_editor/example
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            "$RUNNER_TEMP/patrol-web.log"
            --output test-results/perf
            --markdown "$GITHUB_STEP_SUMMARY"
          )
          baseline="${{ steps.patrol-baseline.outputs.json }}"
          if [[ -f "$baseline" ]]; then
            arguments+=(--baseline "$baseline")
          fi
          dart ../../../tool/patrol_perf_summary.dart "${arguments[@]}"

      - name: Upload Patrol web results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-web-results
          path: |
            packages/dart_pdf_editor/example/test-results
            packages/dart_pdf_editor/example/playwright-report
          if-no-files-found: ignore

  report:
    name: Patrol performance report
    if: >-
      always() &&
      needs.build.result != 'cancelled' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Download Patrol web results
        id: patrol-results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: patrol-web-results
          path: patrol-results

      - name: Comment Patrol performance report
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PATROL_MARKER: dart-pdf-patrol-performance
          PATROL_SUMMARY: patrol-results/test-results/perf/patrol-perf.md
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- ${process.env.PATROL_MARKER} -->`;
            const summaryPath = process.env.PATROL_SUMMARY;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8').trim()
              : [
                  '## Patrol web performance',
                  '',
                  'No performance summary artifact was produced. Open the workflow run for the failing step and raw logs.',
                ].join('\n');
            const body = [
              marker,
              summary,
              '',
              `Automated for commit \`${sha}\` · [workflow run and downloadable trace artifact](${runUrl})`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy:
    # Fork and Dependabot PRs do not receive repository secrets. Other same-repo
    # PRs deploy only the static build artifact from the build job; this job does
    # not check out or execute repository code with Firebase credentials available.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: demo-web-preview
          path: preview

      - name: Write trusted Firebase config
        working-directory: preview
        run: |
          cat > firebase.json <<'JSON'
          {
            "hosting": {
              "public": "build/web",
              "ignore": ["firebase.json", "**/.*"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }],
              "headers": [
                { "source": "**/*.@(eot|otf|ttf|ttc|woff|woff2|font.css)", "headers": [{ "key": "Cache-Control", "value": "max-age=31536000" }] },
                { "source": "**/@(AssetManifest*|FontManifest.json)", "headers": [{ "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }] },
                { "source": "**/*.@(jpg|jpeg|gif|png|svg|webp|ico)", "headers": [{ "key": "Cache-Control", "value": "max-age=31536000" }] },
                { "source": "**/*.@(wasm|mjs)", "headers": [{ "key": "Cache-Control", "value": "max-age=31536000" }] },
                { "source": "**/*.@(js|css)", "headers": [{ "key": "Cache-Control", "value": "max-age=31536000" }] },
                { "source": "/", "headers": [{ "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }] },
                { "source": "/index.html", "headers": [{ "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }] },
                { "source": "/manifest.json", "headers": [{ "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }] },
                { "source": "/version.json", "headers": [{ "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }] },
                { "source": "/flutter_bootstrap.js", "headers": [{ "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }] },
                { "source": "/flutter_service_worker.js", "headers": [{ "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }] },
                { "source": "/flutter.js", "headers": [{ "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }] },
                {
                  "source": "**",
                  "headers": [
                    { "key": "Cross-Origin-Opener-Policy", "value": "same-origin" },
                    { "key": "Cross-Origin-Embedder-Policy", "value": "require-corp" }
                  ]
                }
              ]
            }
          }
          JSON

      # Firebase Hosting caps preview channels per site, and auto-generated
      # per-PR channels accumulate until the next deploy hits
      # "429 channel quota reached". Prune the site back to the most recently
      # updated channels (never the live channel) so there's room. Best
      # effort: any failure here just leaves the deploy below to surface the
      # real quota error.
      - name: Prune stale preview channels
        continue-on-error: true
        working-directory: preview
        env:
          FIREBASE_SITE: dart-pdf-demo
          FIREBASE_PROJECT: dart-pdf-demo
          KEEP_CHANNELS: "10"
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DART_PDF_DEMO }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          if ! npx -y firebase-tools@$FIREBASE_TOOLS_VERSION hosting:channel:list \
                --site "$FIREBASE_SITE" --project "$FIREBASE_PROJECT" --json \
                > channels.json 2> list-err.txt; then
            echo "::warning::channel list failed; skipping prune"
            echo "---- stdout (--json error lands here) ----"
            sed -n '1,60p' channels.json || true
            echo "---- stderr ----"
            grep -v '^npm warn' list-err.txt | sed -n '1,40p' || true
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("channels.json", "utf8"));
            const r = data.result;
            const chans = Array.isArray(r) ? r : ((r && r.channels) || []);
            const prev = chans
              .map(c => ({
                id: String(c.name || "").split("/").pop(),
                t: Date.parse(c.updateTime || c.createTime || c.expireTime || 0) || 0,
              }))
              .filter(c => c.id && c.id !== "live")
              .sort((a, b) => b.t - a.t);
            const del = prev.slice(Number(process.env.KEEP_CHANNELS));
            fs.writeFileSync("prune.txt", del.map(c => c.id).join("\n"));
            console.log(`preview channels: ${prev.length}, deleting ${del.length}`);
          '
          while IFS= read -r ch; do
            [ -z "$ch" ] && continue
            echo "Deleting stale preview channel: $ch"
            npx -y firebase-tools@$FIREBASE_TOOLS_VERSION hosting:channel:delete "$ch" \
              --site "$FIREBASE_SITE" --project "$FIREBASE_PROJECT" --force || true
          done < prune.txt
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS" channels.json prune.txt list-err.txt

      # No channelId -> the action creates an ephemeral preview channel keyed
      # to this PR and comments the URL on it. The channel expires on its own.
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        continue-on-error: true
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          disableComment: true
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DART_PDF_DEMO }}
          projectId: dart-pdf-demo
          expires: 7d
          entryPoint: preview

      - id: recover
        name: Recover the preview URL after a transient release retry error
        if: steps.deploy.outcome == 'failure'
        working-directory: preview
        env:
          FIREBASE_SITE: dart-pdf-demo
          FIREBASE_PROJECT: dart-pdf-demo
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DART_PDF_DEMO }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx -y firebase-tools@$FIREBASE_TOOLS_VERSION hosting:channel:list \
            --site "$FIREBASE_SITE" --project "$FIREBASE_PROJECT" --json \
            > channels.json
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("channels.json", "utf8"));
            const r = data.result;
            const chans = Array.isArray(r) ? r : ((r && r.channels) || []);
            const re = new RegExp("^pr" + process.env.PR_NUMBER + "(-|$)");
            const ch = chans.find(c => re.test(String(c.name || "").split("/").pop()));
            if (!ch || !ch.release) {
              console.error("No channel/release for PR " + process.env.PR_NUMBER + "; deploy genuinely failed.");
              process.exit(1);
            }
            const age = Date.now() - (Date.parse(ch.updateTime || ch.release.releaseTime || 0) || 0);
            if (!(age >= 0 && age < 30 * 60 * 1000)) {
              console.error("Channel release is " + Math.round(age / 1000) + "s old; deploy genuinely failed.");
              process.exit(1);
            }
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, "details_url=" + ch.url + "\n");
            fs.appendFileSync(out, "expire_time_formatted=" + (ch.expireTime || "") + "\n");
            console.log("Recovered preview URL " + ch.url + " (release " + Math.round(age / 1000) + "s old).");
          '
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS" channels.json

      - name: Repair recovered deploy check
        if: steps.deploy.outcome == 'failure' && steps.recover.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PREVIEW_URL: ${{ steps.recover.outputs.details_url }}
        with:
          script: |
            const ref = context.payload.pull_request?.head?.sha || context.sha;
            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              check_name: 'Deploy Preview',
            });
            const failed = runs
              .filter((run) => run.conclusion === 'failure')
              .sort((a, b) => Date.parse(b.completed_at || b.started_at || b.created_at || 0) -
                              Date.parse(a.completed_at || a.started_at || a.created_at || 0));
            if (!failed.length) {
              core.info(`No failed Deploy Preview check-run found on ${ref}`);
              return;
            }
            const run = failed[0];
            const url = process.env.PREVIEW_URL;
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: run.id,
              status: 'completed',
              conclusion: 'success',
              completed_at: new Date().toISOString(),
              details_url: url || run.details_url,
              output: {
                title: 'Deploy preview recovered',
                summary: [
                  'Firebase Hosting deployed the preview, but the deploy action',
                  'reported a transient retry failure after the release was already active.',
                  '',
                  url ? `Preview URL: ${url}` : '',
                ].filter(Boolean).join('\n'),
              },
            });
            core.info(`Marked recovered Deploy Preview check-run ${run.id} successful`);

      - name: Comment preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PREVIEW_LABEL: Example demo preview
          PREVIEW_MARKER: dart-pdf-demo-preview
          PREVIEW_URL: ${{ steps.deploy.outputs.details_url || steps.recover.outputs.details_url }}
          PREVIEW_EXPIRES: ${{ steps.deploy.outputs.expire_time_formatted || steps.recover.outputs.expire_time_formatted }}
        with:
          script: |
            const marker = `<!-- ${{ env.PREVIEW_MARKER }} -->`;
            const label = process.env.PREVIEW_LABEL;
            const url = process.env.PREVIEW_URL;
            const expires = process.env.PREVIEW_EXPIRES;
            const sha = context.sha.slice(0, 7);
            const body = [
              marker,
              `### ${label}`,
              '',
              `Visit the **${label}** preview URL for this PR (updated for commit ${sha}):`,
              '',
              url,
              '',
              `(expires ${expires})`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
