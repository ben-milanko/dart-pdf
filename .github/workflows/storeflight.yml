name: Reconcile Windows store submission
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    runs-on: windows-latest
    environment: storeflight-production
    env:
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CERTIFICATE_BASE64: ${{ secrets.MSSTORE_CERTIFICATE_BASE64 }}
      MSSTORE_CERTIFICATE_PASSWORD: ${{ secrets.MSSTORE_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - uses: microsoft/microsoft-store-apppublisher@v1.4
      - uses: actions/checkout@v7
        with:
          repository: ben-milanko/storeflight
          ref: main
          ssh-key: ${{ secrets.STOREFLIGHT_DEPLOY_KEY }}
          path: .storeflight-cli
      - uses: actions/download-artifact@v8
        with:
          name: storeflight-state-microsoft_store-38015303678
          path: .
          run-id: 38015303678
          github-token: ${{ github.token }}
      - name: Verify exact Windows package and correct native version lookup
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path('app/.storeflight/artifacts/3c89aa9518f745171aef201e/windows/dartpdf-windows-store.msix')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='254b592c1859f331282b454ace4706e85f75bea237d4e8f7f1093f216f30e774'
          # This app maps its declared 8.1.0+45 to MSIX Identity 8.1.0.0.
          # Compare the actual store package version, not the unrelated build 45.
          p=pathlib.Path('.storeflight-cli/lib/src/stores/microsoft_store.dart')
          s=p.read_text();old="!version.split('.').contains(build)"
          assert s.count(old)==1
          p.write_text(s.replace(old,"version != '${context.project.version.name}.0'"))
          PY
          echo '.storeflight-cli/' >> .git/info/exclude
          dart pub global activate --source path .storeflight-cli
      - name: Adopt the existing portal certification from Microsoft
        shell: bash
        run: |
          dart pub global run storeflight:storeflight adopt --release 3c89aa9518f745171aef201e --json > windows-adoption.json
          cat windows-adoption.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('app/.storeflight/releases/3c89aa9518f745171aef201e.json')
          d=json.loads(p.read_text())
          assert d['steps']['submit.microsoft_store']['status']=='succeeded', 'Microsoft has not confirmed certification acceptance'
          assert d['destinations']['submit.microsoft_store']['accepted_for_review']
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storeflight-ledger-microsoft_store-${{ github.run_id }}
          path: |
            app/.storeflight/plans/
            app/.storeflight/releases/
            app/.storeflight/receipts/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storeflight-state-microsoft_store-${{ github.run_id }}
          path: "**/.storeflight/**"
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-adoption-${{ github.run_id }}
          path: windows-adoption.json
