name: Read Play lifecycle (release diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Read production version 47 lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: storeflight-production
    env:
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Read release lifecycle (no store mutations)
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64,json,os,subprocess,time,urllib.request,urllib.parse
          from pathlib import Path
          phase='credential_read'
          try:
           c=json.loads(os.environ.pop('PLAY_STORE_SERVICE_ACCOUNT_JSON'))
           def b64(x): return base64.urlsafe_b64encode(x).rstrip(b'=')
           now=int(time.time()); token_url='https://oauth2.googleapis.com/token'
           header=b64(json.dumps({'alg':'RS256','typ':'JWT','kid':c['private_key_id']},separators=(',',':')).encode())
           payload=b64(json.dumps({'iss':c['client_email'],'scope':'https://www.googleapis.com/auth/androidpublisher','aud':token_url,'iat':now,'exp':now+600},separators=(',',':')).encode())
           unsigned=header+b'.'+payload
           r,w=os.pipe();os.write(w,c['private_key'].encode());os.close(w)
           try:
            signature=subprocess.run(['/usr/bin/openssl','dgst','-sha256','-sign','/dev/fd/'+str(r)],input=unsigned,stdout=subprocess.PIPE,stderr=subprocess.PIPE,pass_fds=(r,),env={'PATH':'/usr/bin:/bin'},check=True).stdout
           finally: os.close(r)
           phase='token_request'
           data=urllib.parse.urlencode({'grant_type':'urn:ietf:params:oauth:grant-type:jwt-bearer','assertion':(unsigned+b'.'+b64(signature)).decode()}).encode()
           with urllib.request.urlopen(urllib.request.Request(token_url,data=data),timeout=20) as response: token=json.load(response)['access_token']
           phase='read_release_lifecycle'
           url='https://androidpublisher.googleapis.com/androidpublisher/v3/applications/dev.milanko.dartpdf/tracks/production/releases'
           req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
           with urllib.request.urlopen(req,timeout=20) as response: listing=json.load(response)
           found=[]
           for release in listing.get('releases',[]):
            artifacts=release.get('activeArtifacts',[])
            if any(str(a.get('versionCode'))=='47' for a in artifacts):
             found.append({'versionCode':'47','releaseLifecycleState':release.get('releaseLifecycleState')})
           result={'lookup':'found' if found else 'version47_not_listed','releases':found,'checked_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          except Exception as e:
           result={'lookup':'unavailable','phase':phase,'error_type':type(e).__name__,'http_status':getattr(e,'code',None)}
          Path('play-lifecycle-47.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PYCODE
      - uses: actions/upload-artifact@v7
        with:
          name: play-lifecycle-47
          path: play-lifecycle-47.json
          retention-days: 90
