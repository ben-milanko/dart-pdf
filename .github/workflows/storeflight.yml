name: Verify Whistler Apple signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    environment: storeflight-production
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_PROVISIONING_PROFILE_MAC_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_MAC_BASE64 }}
    steps:
      - uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ env.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
      - name: Validate profiles and sign native iOS, macOS and installer probes
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64,hashlib,json,os,plistlib,subprocess
          from pathlib import Path
          team='N5K9GK8B27'; bundle='dev.milanko.dartpdf'
          distribution_sha256='8817d1c29b2225598bfe38528397e432fed1b56493db60ec84382238861003d1'
          def run(argv,**kw):
           return subprocess.run(argv,check=True,capture_output=True,**kw).stdout
          p12=Path('probe.p12');p12.write_bytes(base64.b64decode(os.environ.pop('APPLE_CERTIFICATE_BASE64')))
          password=os.environ.pop('APPLE_CERTIFICATE_PASSWORD')
          profiles={}
          for platform,name in [('ios','APPLE_PROVISIONING_PROFILE_BASE64'),('macos','APPLE_PROVISIONING_PROFILE_MAC_BASE64')]:
           profile_file=Path(platform+'.profile');profile_file.write_bytes(base64.b64decode(os.environ.pop(name)))
           profile=plistlib.loads(run(['security','cms','-D','-i',str(profile_file)]))
           assert profile['TeamIdentifier']==[team]
           assert distribution_sha256 in [hashlib.sha256(c).hexdigest() for c in profile['DeveloperCertificates']]
           ent=profile['Entitlements'];app_id=ent.get('application-identifier') or ent.get('com.apple.application-identifier')
           assert app_id==team+'.'+bundle
           profiles[platform]=(profile_file,ent)
          Path('main.c').write_text('int main(void) { return 0; }\n')
          dist='Apple Distribution: Railway Engineering Solutions Pty Ltd ('+team+')'
          installer='3rd Party Mac Developer Installer: Railway Engineering Solutions Pty Ltd ('+team+')'
          for platform,(profile_file,ent) in profiles.items():
           app=Path(platform)/'SigningProbe.app';contents=app if platform=='ios' else app/'Contents'
           binary_dir=contents if platform=='ios' else contents/'MacOS'
           binary_dir.mkdir(parents=True)
           info={'CFBundleIdentifier':bundle,'CFBundleExecutable':'SigningProbe','CFBundleName':'SigningProbe','CFBundlePackageType':'APPL','CFBundleShortVersionString':'1.0','CFBundleVersion':'1'}
           (contents/'Info.plist').write_bytes(plistlib.dumps(info))
           (contents/('embedded.mobileprovision' if platform=='ios' else 'embedded.provisionprofile')).write_bytes(profile_file.read_bytes())
           if platform=='ios':
            sdk=run(['xcrun','--sdk','iphoneos','--show-sdk-path']).decode().strip()
            run(['xcrun','--sdk','iphoneos','clang','-target','arm64-apple-ios15.0','-isysroot',sdk,'main.c','-o',str(binary_dir/'SigningProbe')])
           else:
            ent['com.apple.security.app-sandbox']=True
            run(['xcrun','clang','main.c','-o',str(binary_dir/'SigningProbe')])
           ent_path=Path(platform+'-entitlements.plist');ent_path.write_bytes(plistlib.dumps(ent))
           run(['codesign','--force','--sign',dist,'--keychain','signing_temp.keychain','--entitlements',str(ent_path),str(app)])
           run(['codesign','--verify','--deep','--strict',str(app)])
          run(['productbuild','--component','macos/SigningProbe.app','/Applications','--sign',installer,'--keychain','signing_temp.keychain','SigningProbe.pkg'])
          pkg=run(['pkgutil','--check-signature','SigningProbe.pkg']).decode()
          assert installer in pkg and 'signed by a certificate trusted by' in pkg
          result={'ios_codesign':'verified','macos_codesign':'verified','macos_installer_signature':'verified','profile_bundle':bundle,'team':team,'macbook_used':False,'store_upload':False}
          Path('whistler-signing-verification.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PYCODE
      - uses: actions/upload-artifact@v7
        with:
          name: whistler-signing-verification
          path: whistler-signing-verification.json
          retention-days: 90
