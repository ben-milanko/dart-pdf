          # expansion: a {a,b} pattern matches nothing at all, and only warns.
          path: |
            **/.storeflight/plans/**
            **/.storeflight/releases/**
            **/.storeflight/progress/**
            **/.storeflight/diagnostics/**
            **/.storeflight/certifications/**
            **/.storeflight/receipts/**
            !.storeflight-cli/**
            !**/.secrets/**
            !**/*.p8
            !**/*.p12
            !**/*.jks
            !**/*.keystore
            !**/key.properties
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always() && !inputs.dry_run && steps.sanitize_release_state.outcome == 'success'
        with:
          name: storeflight-state-macos-${{ github.run_id }}
          path: |
            **/.storeflight/plans/**
            **/.storeflight/releases/**
            **/.storeflight/progress/**
            **/.storeflight/diagnostics/**
            **/.storeflight/certifications/**
            **/.storeflight/receipts/**
            **/.storeflight/artifacts/**
            **/*.aab
            **/*.ipa
            **/*.pkg
            **/*.msix
            **/*.msixupload
            **/*.snap
            **/*.flatpak
            **/*.tar.gz
            **/*.AppImage
            **/*.appimage
            **/*.zip
            !.storeflight-cli/**
            !**/.secrets/**
            !**/*.p8
            !**/*.p12
            !**/*.jks
            !**/*.keystore
            !**/key.properties
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

  google_play:
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && ((inputs.destinations == '' && inputs.deliveries == '') || contains(format(',{0},', inputs.destinations), ',google_play,')) && (inputs.platforms == '' || contains(format(',{0},', inputs.platforms), ',android,'))
    name: Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: storeflight-production
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - name: Check out Storeflight
        uses: actions/checkout@v7
        with:
          repository: ben-milanko/storeflight
          ref: f0737999fc6a6634c2aab999e666a3546e057291 # experiment-preserving releases
          ssh-key: ${{ secrets.STOREFLIGHT_DEPLOY_KEY }}
          path: .storeflight-cli
      - name: Install Storeflight
        shell: bash
        run: |
          echo '.storeflight-cli/' >> .git/info/exclude
          dart pub global activate --source path .storeflight-cli
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android upload key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/android/app"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/android/app/upload-keystore.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$GITHUB_WORKSPACE/app/android/app/upload-keystore.jks" \
            > "$GITHUB_WORKSPACE/app/android/key.properties"
      - name: Prepare hosted Android plugins
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

          patch_gradle() {
            local gradle_file="$1"
            local namespace="${2:-}"
            if [[ -z "$gradle_file" ]]; then
              echo "No matching hosted Android Gradle file found; skipping patch."
              return 0
            fi

            python3 - "$gradle_file" "$namespace" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          namespace = sys.argv[2]
          text = path.read_text()
          text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
          if namespace and 'namespace ' not in text:
              text = text.replace('android {\n', f'android {{\n    namespace "{namespace}"\n', 1)
          path.write_text(text)
          PY
          }

          # Patch EVERY match, not just the first: `-print -quit` can return a
          # plugin's example/android/build.gradle instead of its own (find's
          # order is filesystem-dependent), which leaves the real plugin
          # unpatched and fails :onnxruntime:checkReleaseAarMetadata.
          while IFS= read -r f; do patch_gradle "$f"; done < <(find "$HOME/.pub-cache" -path '*/onnxruntime-*/android/build.gradle')
          while IFS= read -r f; do patch_gradle "$f" dev.irondash.engine_context; done < <(find "$HOME/.pub-cache" -path '*/irondash_engine_context-*/android/build.gradle')
          super_native_gradle="$(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle' -print -quit)"
          while IFS= read -r f; do patch_gradle "$f" com.superlist.super_native_extensions; done < <(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle')

          if [[ -n "$super_native_gradle" ]]; then
            cargokit_gradle="$(dirname "$super_native_gradle")/../cargokit/gradle/plugin.gradle"
          else
            cargokit_gradle=""
          fi

          if [[ -n "$cargokit_gradle" && -f "$cargokit_gradle" ]]; then
            python3 - "$cargokit_gradle" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace('for (project in projects) {', 'for (project in projects.values()) {')
          text = text.replace('project.value.getPlugins()', 'project.getPlugins()')
          text = text.replace(
              'return _findFlutterPlugin(project.value.childProjects);',
              '''def found = _findFlutterPlugin(project.childProjects);
                      if (found != null) {
                          return found;
                      }''',
          )
          if 'projects.values()' not in text or 'project.value.getPlugins()' in text:
              raise SystemExit("CargoKit plugin patch target not found")
          path.write_text(text)
          PY
          else
            echo "No CargoKit Gradle plugin found; skipping patch."
          fi
      - name: Restore resumable release state
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: storeflight-state-google_play-${{ inputs.resume_run_id }}
          path: .
          merge-multiple: true
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Submit to review
        if: inputs.resume_run_id == '' || hashFiles('**/.storeflight/releases/latest') == ''
        shell: bash
        run: >-
          dart pub global run storeflight:storeflight submit
          --ci github
          --config "${{ env.STOREFLIGHT_CONFIG }}"
          --profile "${{ inputs.profile }}"
          --destination google_play
          --until "${{ inputs.until }}"
          --wait
          --yes
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.dry_run && '--validate-access' || '' }}
      - name: Resume interrupted release
        if: inputs.resume_run_id != '' && hashFiles('**/.storeflight/releases/latest') != ''
        shell: bash
        env:
          STOREFLIGHT_FROM_STEP: ${{ inputs.from_step }}
        run: >-
          dart pub global run storeflight:storeflight resume
          --ci github
          --config "${{ env.STOREFLIGHT_CONFIG }}"
          --wait
          --yes
          ${{ inputs.allow_source_drift && '--allow-source-drift' || '' }}
          ${STOREFLIGHT_FROM_STEP:+--from-if-planned "$STOREFLIGHT_FROM_STEP"}
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.dry_run && '--validate-access' || '' }}
      # Uploaded before any post-job cleanup, so a waiting client can read
      # the store's answer while caches are still being saved.
      # Artifacts are public; GitHub's console masking does not sanitize them.
      - name: Sanitize release state before public upload
        id: sanitize_release_state
        if: always()
        shell: bash
        run: python3 tool/storeflight/sanitize_diagnostics.py
      - name: Publish native submission receipts
        if: always() && !inputs.dry_run && steps.sanitize_release_state.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: storeflight-receipt-google_play-${{ github.run_id }}
          path: '**/.storeflight/receipts/**'
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always() && steps.sanitize_release_state.outcome == 'success'
        with:
          name: storeflight-ledger-google_play-${{ github.run_id }}
          # upload-artifact globs through @actions/glob, which has no brace
          # expansion: a {a,b} pattern matches nothing at all, and only warns.
          path: |
            **/.storeflight/plans/**
            **/.storeflight/releases/**
            **/.storeflight/progress/**
            **/.storeflight/diagnostics/**
            **/.storeflight/certifications/**
            **/.storeflight/receipts/**
            !.storeflight-cli/**
            !**/.secrets/**
            !**/*.p8
            !**/*.p12
            !**/*.jks
            !**/*.keystore
            !**/key.properties
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always() && !inputs.dry_run && steps.sanitize_release_state.outcome == 'success'
        with:
          name: storeflight-state-google_play-${{ github.run_id }}
          path: |
            **/.storeflight/plans/**
            **/.storeflight/releases/**
            **/.storeflight/progress/**
            **/.storeflight/diagnostics/**
            **/.storeflight/certifications/**
            **/.storeflight/receipts/**
            **/.storeflight/artifacts/**
            **/*.aab
            **/*.ipa
            **/*.pkg
            **/*.msix
            **/*.msixupload
            **/*.snap
            **/*.flatpak
            **/*.tar.gz
            **/*.AppImage
