  summary:
    name: Release summary
    if: always()
    needs: [apple_ios, apple_macos, google_play, microsoft_store, snap, flatpak, github_release_android, github_release_ios, github_release_macos, github_release_windows, github_release_snap, github_release_flatpak, github_release_web, pub_dev, web]
    runs-on: ubuntu-latest
    environment: storeflight-production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
      - name: Check out Storeflight
        uses: actions/checkout@v7
        with:
          repository: ben-milanko/storeflight
          ref: f0737999fc6a6634c2aab999e666a3546e057291 # experiment-preserving releases
          ssh-key: ${{ secrets.STOREFLIGHT_DEPLOY_KEY }}
          path: .storeflight-cli
      - name: Install Storeflight
        shell: bash
        run: |
          echo '.storeflight-cli/' >> .git/info/exclude
          dart pub global activate --source path .storeflight-cli
      - uses: actions/download-artifact@v8
        with:
          pattern: storeflight-ledger-*
          path: ledgers
      - name: Inventory durable ledgers
        shell: bash
        run: find ledgers -type f -name '*.json' -print
      - name: Build consolidated release receipt
        if: always()
        shell: bash
        env:
          STOREFLIGHT_UNTIL: ${{ inputs.until }}
        run: |
          set +e
          dart pub global run storeflight:storeflight report \
          --config "${{ env.STOREFLIGHT_CONFIG }}" \
          --ledger-directory ledgers \
          --format markdown \
          --output storeflight-release-report.md
          report_status=$?
          set -e
          if [[ "$report_status" == 75 && ("$STOREFLIGHT_UNTIL" == build || "$STOREFLIGHT_UNTIL" == upload) ]]; then
            echo "Requested $STOREFLIGHT_UNTIL phase recorded; final release completion is still pending."
            exit 0
          fi
          exit "$report_status"
      # Artifacts are public; GitHub's console masking does not sanitize them.
      - name: Sanitize release state before public upload
        id: sanitize_release_state
        if: always()
        shell: bash
        run: python3 tool/storeflight/sanitize_diagnostics.py
      - uses: actions/upload-artifact@v7
        if: always() && steps.sanitize_release_state.outcome == 'success'
        with:
          name: storeflight-release-report-${{ github.run_id }}
          path: storeflight-release-report.md
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce destination results
        if: always()
        shell: bash
        env:
          STOREFLIGHT_NEEDS: ${{ toJson(needs) }}
        run: echo "$STOREFLIGHT_NEEDS" | jq -e 'any(.[]; .result == "success") and all(.[]; .result == "success" or .result == "skipped")'
