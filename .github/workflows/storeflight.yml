# Generated by Storeflight. Store secrets in the protected environment.
name: Storeflight release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Storeflight profile
        default: production
        required: true
        type: string
      until:
        description: Terminal release phase
        default: review
        required: true
        type: choice
        options: [build, upload, review]
      dry_run:
        description: Validate store access without builds, uploads, or releases
        default: false
        type: boolean
      resume_run_id:
        description: Prior workflow run ID to resume; blank starts a release
        default: ''
        required: false
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: storeflight-${{ github.repository }}-${{ inputs.profile }}
  cancel-in-progress: false

env:
  STOREFLIGHT_CONFIG: ../storeflight.yaml

jobs:
  microsoft_store:
    name: Microsoft Store
    runs-on: windows-latest
    timeout-minutes: 300
    environment: storeflight-production
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      MSSTORE_CERTIFICATE_BASE64: ${{ secrets.MSSTORE_CERTIFICATE_BASE64 }}
      MSSTORE_CERTIFICATE_PASSWORD: ${{ secrets.MSSTORE_CERTIFICATE_PASSWORD }}
      MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
      MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
      MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - name: Check out Storeflight
        uses: actions/checkout@v7
        with:
          repository: ben-milanko/storeflight
          ref: main
          ssh-key: ${{ secrets.STOREFLIGHT_DEPLOY_KEY }}
          path: .storeflight-cli
      - name: Install Storeflight
        shell: bash
        run: |
          echo '.storeflight-cli/' >> .git/info/exclude
          dart pub global activate --source path .storeflight-cli
      - uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Restore resumable release state
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: storeflight-state-microsoft_store-${{ inputs.resume_run_id }}
          path: .
          merge-multiple: true
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Submit to review
        if: inputs.resume_run_id == ''
        run: >-
          dart pub global run storeflight:storeflight submit
          --ci github
          --config "${{ env.STOREFLIGHT_CONFIG }}"
          --profile "${{ inputs.profile }}"
          --destination microsoft_store
          --until "${{ inputs.until }}"
          --wait
          --yes
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.dry_run && '--validate-access' || '' }}
      - name: Resume interrupted release
        if: inputs.resume_run_id != ''
        run: >-
          dart pub global run storeflight:storeflight resume
          --ci github
          --config "${{ env.STOREFLIGHT_CONFIG }}"
          --wait
          --yes
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.dry_run && '--validate-access' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storeflight-ledger-microsoft_store-${{ github.run_id }}
          path: '**/.storeflight/{plans,releases,progress,certifications}/**'
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always() && !inputs.dry_run
        with:
          name: storeflight-state-microsoft_store-${{ github.run_id }}
          path: |
            **/.storeflight/{plans,releases,progress,certifications,artifacts}/**
            **/*.aab
            **/*.ipa
            **/*.pkg
            **/*.msix
            **/*.msixupload
            **/*.snap
            **/*.flatpak
            **/*.tar.gz
            **/*.zip
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

  snap:
    name: Snap Store
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: storeflight-production
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
