          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always() && !inputs.dry_run
        with:
          name: storeflight-state-snap-${{ github.run_id }}
          path: |
            **/.storeflight/{plans,releases,progress,certifications,artifacts}/**
            **/*.aab
            **/*.ipa
            **/*.pkg
            **/*.msix
            **/*.msixupload
            **/*.snap
            **/*.flatpak
