          proc=subprocess.run(['openssl','cms','-encrypt','-binary','-aes-256-cbc','-outform','DER','-out','whistler-credentials.cms','whistler-recipient.pem'],input=json.dumps(values).encode(),stdout=subprocess.PIPE,stderr=subprocess.PIPE)
