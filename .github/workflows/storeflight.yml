name: Storeflight release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  flatpak:
    name: Complete Flatpak release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: storeflight-production
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: app-v8.1.0
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - uses: actions/checkout@v7
        with:
          repository: ben-milanko/storeflight
          ref: main
          ssh-key: ${{ secrets.STOREFLIGHT_DEPLOY_KEY }}
          path: .storeflight-cli
      - name: Install release tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak jq
          echo '.storeflight-cli/' >> .git/info/exclude
          dart pub global activate --source path .storeflight-cli
      - name: Verify the existing GitHub prerequisite and exact Linux input
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == 570dd6df336b921f967cf3e0d61e09585ea9e46c ]]
          mkdir -p app/.storeflight/inputs
          gh release view app-v8.1.0 --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json"
          [[ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" == false ]]
          gh release download app-v8.1.0 --repo "$GITHUB_REPOSITORY" --pattern app-linux.tar.gz --dir app/.storeflight/inputs
          expected="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/app-v8.1.0" --jq '.assets[]|select(.name=="app-linux.tar.gz")|.digest')"
          actual="sha256:$(sha256sum app/.storeflight/inputs/app-linux.tar.gz|cut -d' ' -f1)"
          [[ "$actual" == "$expected" ]]
      - name: Configure this independent continuation
        run: |
          cat > "$RUNNER_TEMP/publish-flatpak-and-wait.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-flatpak.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run publish-flatpak.yml --repo "$GITHUB_REPOSITORY" --ref app-v8.1.0 -f version=8.1.0
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-flatpak.yml --branch app-v8.1.0 --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$run_id" != 0 && "$run_id" != "$previous" ]]; then break; fi
            sleep 2
          done
          [[ "$run_id" != 0 && "$run_id" != "$previous" ]]
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          [[ "$(curl -fsSL https://dartpdf-flatpak.web.app/version.json | jq -r .version)" == 8.1.0 ]]
          SH
          chmod +x "$RUNNER_TEMP/publish-flatpak-and-wait.sh"
          python3 - <<'PY'
          import os,pathlib,re,json
          s=pathlib.Path('storeflight.yaml').read_text()
          s=s.replace('  root: app\n','  root: '+str(pathlib.Path('app').resolve())+'\n',1).replace('  isolate_worktree: true\n','  isolate_worktree: false\n',1)
          s=re.sub(r'  worktree_include:\n(?:    - .*\n)+','  worktree_include: []\n',s)
          # The prerequisite release is already published and was verified above.
          s=s.replace('        depends_on: [github_release]','        depends_on: []',1)
          start=s.index('        publish_command:',s.index('      flatpak:\n',s.index('    deliveries:')))
          end=s.index('        idempotency_check:',start)
          command=['bash',os.path.join(os.environ['RUNNER_TEMP'],'publish-flatpak-and-wait.sh')]
          s=s[:start]+'        publish_command: '+json.dumps(command)+'\n'+s[end:]
          pathlib.Path(os.environ['RUNNER_TEMP'],'flatpak-storeflight.yaml').write_text(s)
          PY
      - name: Publish, sign and verify through Storeflight
        run: |
          dart pub global run storeflight:storeflight submit \
            --config "$RUNNER_TEMP/flatpak-storeflight.yaml" \
            --delivery flatpak --platform flatpak \
            --artifact "flatpak=$GITHUB_WORKSPACE/app/.storeflight/inputs/app-linux.tar.gz" \
            --until review --wait --yes --progress plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storeflight-ledger-flatpak-${{ github.run_id }}
          path: |
            **/.storeflight/plans/**
            **/.storeflight/releases/**
            **/.storeflight/progress/**
            **/.storeflight/certifications/**
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storeflight-state-flatpak-${{ github.run_id }}
          path: "**/.storeflight/**"
          include-hidden-files: true
