# Generated by Storeflight. Store secrets in the protected environment.
name: Storeflight release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Storeflight profile
        default: production
        required: true
        type: string
      until:
        description: Terminal release phase
        default: review
        required: true
        type: choice
        options: [build, upload, review]
      dry_run:
        description: Validate store access without builds, uploads, or releases
        default: false
        type: boolean
      destinations:
        description: Comma-separated store destinations; blank selects all unless deliveries is set
        default: ''
        type: string
      deliveries:
        description: Comma-separated deliveries; blank selects all unless destinations is set
        default: ''
        type: string
      platforms:
        description: Comma-separated platforms; blank selects all
        default: ''
        type: string
      resume_run_id:
        description: Prior workflow run ID to resume; blank starts a release
        default: ''
        required: false
        type: string
      allow_source_drift:
        description: Let a resume run at a commit other than the release's, if no app inputs changed
        default: false
        required: false
        type: boolean
      from_step:
        description: Step a resume restarts from, in the lanes that plan it; blank resumes where each lane stopped
        default: ''
        required: false
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: storeflight-${{ github.repository }}-${{ inputs.profile }}
  cancel-in-progress: false

env:
  STOREFLIGHT_CONFIG: storeflight.yaml

jobs:
  apple_ios:
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && ((inputs.destinations == '' && inputs.deliveries == '') || contains(format(',{0},', inputs.destinations), ',apple,')) && (inputs.platforms == '' || contains(format(',{0},', inputs.platforms), ',ios,'))
    name: Apple iOS
    runs-on: macos-15
    timeout-minutes: 120
    environment: storeflight-production
    env:
      # macos-15 defaults to Xcode 16; App Store iOS uploads require SDK 26+.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_PROVISIONING_PROFILE_MAC_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_MAC_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify App Store iOS SDK requirements
        shell: bash
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk_version%%.*}" -ge 26
          echo "Selected iOS SDK $sdk_version"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - name: Check out Storeflight
        uses: actions/checkout@v7
        with:
          repository: ben-milanko/storeflight
          ref: 4822df73ac212c8ceb15cbb70352a22bdeccc625 # experiment preservation with bounded Apple reads
          ssh-key: ${{ secrets.STOREFLIGHT_DEPLOY_KEY }}
          path: .storeflight-cli
      - name: Install Storeflight
        shell: bash
        run: |
          echo '.storeflight-cli/' >> .git/info/exclude
          dart pub global activate --source path .storeflight-cli
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - uses: apple-actions/import-codesign-certs@v7
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        with:
          p12-file-base64: ${{ env.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install iOS provisioning profile
        if: env.APPLE_PROVISIONING_PROFILE_BASE64 != ''
        shell: bash
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/storeflight.mobileprovision"
      - name: Select App Store distribution signing
        if: ${{ !inputs.dry_run }}
        run: python3 .github/scripts/configure-apple-distribution.py ios
      - name: Restore resumable release state
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: storeflight-state-ios-${{ inputs.resume_run_id }}
          path: .
          merge-multiple: true
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Submit to review
        if: inputs.resume_run_id == '' || hashFiles('**/.storeflight/releases/latest') == ''
        shell: bash
        run: >-
          dart pub global run storeflight:storeflight submit
          --ci github
          --config "${{ env.STOREFLIGHT_CONFIG }}"
          --profile "${{ inputs.profile }}"
          --destination apple
          --platform ios
          --until "${{ inputs.until }}"
          --wait
          --yes
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.dry_run && '--validate-access' || '' }}
      - name: Resume interrupted release
        if: inputs.resume_run_id != '' && hashFiles('**/.storeflight/releases/latest') != ''
        shell: bash
        env:
          STOREFLIGHT_FROM_STEP: ${{ inputs.from_step }}
        run: >-
          dart pub global run storeflight:storeflight resume
          --ci github
          --config "${{ env.STOREFLIGHT_CONFIG }}"
          --wait
          --yes
          ${{ inputs.allow_source_drift && '--allow-source-drift' || '' }}
          ${STOREFLIGHT_FROM_STEP:+--from-if-planned "$STOREFLIGHT_FROM_STEP"}
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.dry_run && '--validate-access' || '' }}
      # Uploaded before any post-job cleanup, so a waiting client can read
      # the store's answer while caches are still being saved.
      # Artifacts are public; GitHub's console masking does not sanitize them.
      - name: Sanitize release state before public upload
        id: sanitize_release_state
        if: always()
        shell: bash
        run: python3 tool/storeflight/sanitize_diagnostics.py
      - name: Publish native submission receipts
        if: always() && !inputs.dry_run && steps.sanitize_release_state.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: storeflight-receipt-ios-${{ github.run_id }}
          path: '**/.storeflight/receipts/**'
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always() && steps.sanitize_release_state.outcome == 'success'
        with:
          name: storeflight-ledger-ios-${{ github.run_id }}
          # upload-artifact globs through @actions/glob, which has no brace
          # expansion: a {a,b} pattern matches nothing at all, and only warns.
          path: |
            **/.storeflight/plans/**
            **/.storeflight/releases/**
            **/.storeflight/progress/**
            **/.storeflight/diagnostics/**
            **/.storeflight/certifications/**
            **/.storeflight/receipts/**
            !.storeflight-cli/**
            !**/.secrets/**
            !**/*.p8
            !**/*.p12
            !**/*.jks
            !**/*.keystore
            !**/key.properties
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always() && !inputs.dry_run && steps.sanitize_release_state.outcome == 'success'
        with:
          name: storeflight-state-ios-${{ github.run_id }}
          path: |
            **/.storeflight/plans/**
            **/.storeflight/releases/**
            **/.storeflight/progress/**
            **/.storeflight/diagnostics/**
            **/.storeflight/certifications/**
            **/.storeflight/receipts/**
            **/.storeflight/artifacts/**
            **/*.aab
            **/*.ipa
            **/*.pkg
            **/*.msix
            **/*.msixupload
            **/*.snap
            **/*.flatpak
            **/*.tar.gz
            **/*.AppImage
            **/*.appimage
            **/*.zip
            !.storeflight-cli/**
            !**/.secrets/**
            !**/*.p8
            !**/*.p12
            !**/*.jks
            !**/*.keystore
            !**/key.properties
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

  apple_macos:
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && ((inputs.destinations == '' && inputs.deliveries == '') || contains(format(',{0},', inputs.destinations), ',apple,')) && (inputs.platforms == '' || contains(format(',{0},', inputs.platforms), ',macos,'))
    name: Apple macOS
    runs-on: macos-15
    timeout-minutes: 120
    environment: storeflight-production
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_PROVISIONING_PROFILE_MAC_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_MAC_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - name: Check out Storeflight
        uses: actions/checkout@v7
        with:
          repository: ben-milanko/storeflight
          ref: f0737999fc6a6634c2aab999e666a3546e057291 # experiment-preserving releases
          ssh-key: ${{ secrets.STOREFLIGHT_DEPLOY_KEY }}
          path: .storeflight-cli
      - name: Install Storeflight
        shell: bash
        run: |
          echo '.storeflight-cli/' >> .git/info/exclude
          dart pub global activate --source path .storeflight-cli
      - uses: apple-actions/import-codesign-certs@v7
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        with:
          p12-file-base64: ${{ env.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install macOS provisioning profile
        if: env.APPLE_PROVISIONING_PROFILE_MAC_BASE64 != ''
        shell: bash
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISIONING_PROFILE_MAC_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/storeflight-mac.provisionprofile"
      - name: Select App Store distribution signing
        if: ${{ !inputs.dry_run }}
        run: python3 .github/scripts/configure-apple-distribution.py macos
      - name: Restore resumable release state
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: storeflight-state-macos-${{ inputs.resume_run_id }}
          path: .
          merge-multiple: true
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Submit to review
        if: inputs.resume_run_id == '' || hashFiles('**/.storeflight/releases/latest') == ''
        shell: bash
        run: >-
          dart pub global run storeflight:storeflight submit
          --ci github
          --config "${{ env.STOREFLIGHT_CONFIG }}"
          --profile "${{ inputs.profile }}"
          --destination apple
          --platform macos
          --until "${{ inputs.until }}"
          --wait
          --yes
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.dry_run && '--validate-access' || '' }}
      - name: Resume interrupted release
        if: inputs.resume_run_id != '' && hashFiles('**/.storeflight/releases/latest') != ''
        shell: bash
        env:
          STOREFLIGHT_FROM_STEP: ${{ inputs.from_step }}
        run: >-
          dart pub global run storeflight:storeflight resume
          --ci github
          --config "${{ env.STOREFLIGHT_CONFIG }}"
          --wait
          --yes
          ${{ inputs.allow_source_drift && '--allow-source-drift' || '' }}
          ${STOREFLIGHT_FROM_STEP:+--from-if-planned "$STOREFLIGHT_FROM_STEP"}
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.dry_run && '--validate-access' || '' }}
      # Uploaded before any post-job cleanup, so a waiting client can read
      # the store's answer while caches are still being saved.
      # Artifacts are public; GitHub's console masking does not sanitize them.
      - name: Sanitize release state before public upload
        id: sanitize_release_state
        if: always()
        shell: bash
        run: python3 tool/storeflight/sanitize_diagnostics.py
      - name: Publish native submission receipts
        if: always() && !inputs.dry_run && steps.sanitize_release_state.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
