name: Patrol E2E

on:
  push:
    branches: [main, deploy]
  pull_request:
  workflow_dispatch:

concurrency:
  group: patrol-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.0
  PATROL_CLI_VERSION: 4.7.0
  PATROL_ANALYTICS_ENABLED: "false"
  EXAMPLE_DIR: packages/dart_pdf_editor/example

jobs:
  web:
    name: Web (Chromium)
    # Pull requests reuse the already-initialized Preview Demo Web build job.
    # Keep this standalone lane for main/deploy pushes and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Precache Flutter web artifacts
        run: flutter precache --web
      - name: Install dependencies and Patrol CLI
        run: |
          flutter pub get
          dart pub global activate patrol_cli "$PATROL_CLI_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Run Patrol on web
        id: patrol-web
        working-directory: ${{ env.EXAMPLE_DIR }}
        shell: bash
        run: |
          set -o pipefail
          patrol test \
            --device chrome \
            --target patrol_test/demo_e2e_test.dart \
            --dart-define PDF_PERF_LOG=true \
            --dart-define PDF_BUILD_COMMIT=${{ github.sha }} \
            --show-flutter-logs \
            --web-headless \
            --web-locale en-US \
            --web-workers 1 \
            --web-video retain-on-failure \
            --verbose \
            2>&1 | tee "$RUNNER_TEMP/patrol-web.log"
      - name: Collect Patrol performance trace
        if: always()
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: >-
          dart ../../../tool/patrol_perf_summary.dart
          "$RUNNER_TEMP/patrol-web.log"
          --output test-results/perf
          --markdown "$GITHUB_STEP_SUMMARY"
      - name: Upload Patrol web results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-web-results
          path: |
            ${{ env.EXAMPLE_DIR }}/test-results
            ${{ env.EXAMPLE_DIR }}/playwright-report
          if-no-files-found: ignore

  android:
    name: Android (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies and Patrol CLI
        run: |
          flutter pub get
          dart pub global activate patrol_cli "$PATROL_CLI_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install Android compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=3 \
            "platforms;android-37.0"
          ln -sfn \
            "$ANDROID_HOME/platforms/android-37.0" \
            "$ANDROID_HOME/platforms/android-37"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Patrol on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: ${{ env.EXAMPLE_DIR }}
          script: >-
            patrol test
            --device emulator-5554
            --target patrol_test/demo_e2e_test.dart
      - name: Upload Patrol Android report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-android-report
          path: ${{ env.EXAMPLE_DIR }}/build/app/reports/androidTests
          if-no-files-found: ignore

  ios:
    name: iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies and Patrol CLI
        run: |
          flutter pub get
          dart pub global activate patrol_cli "$PATROL_CLI_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Boot an iOS simulator
        id: simulator
        run: |
          device_id="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run Patrol on iOS
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: >-
          patrol test
          --device "${{ steps.simulator.outputs.device_id }}"
          --target patrol_test/demo_e2e_test.dart
      - name: Upload Patrol iOS result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-ios-results
          path: ${{ env.EXAMPLE_DIR }}/build/*.xcresult
          if-no-files-found: ignore

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies and Patrol CLI
        run: |
          flutter pub get
          dart pub global activate patrol_cli "$PATROL_CLI_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Run Patrol on macOS
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: >-
          patrol test
          --device macos
          --target patrol_test/demo_e2e_test.dart
      - name: Upload Patrol macOS result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patrol-macos-results
          path: ${{ env.EXAMPLE_DIR }}/build/*.xcresult
          if-no-files-found: ignore
