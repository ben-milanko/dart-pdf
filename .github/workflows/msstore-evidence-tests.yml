name: Microsoft evidence reader tests
on:
  pull_request:
    paths:
      - 'app/packaging/msstore/read_evidence.py'
      - 'app/packaging/msstore/test_read_evidence.py'
      - '.github/workflows/msstore-readonly-evidence.yml'
      - '.github/workflows/msstore-evidence-tests.yml'
  push:
    branches: [main]
    paths:
      - 'app/packaging/msstore/read_evidence.py'
      - 'app/packaging/msstore/test_read_evidence.py'
      - '.github/workflows/msstore-readonly-evidence.yml'
      - '.github/workflows/msstore-evidence-tests.yml'
permissions:
  contents: read
jobs:
  msstore-evidence-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - name: Exercise five offline reader boundary tests
        run: python -m unittest discover -v -s app/packaging/msstore -p 'test_read_evidence.py'
