name: Marketing screenshots

# Captures native device screenshots of the DartPDF app and the example app
# and frames them onto the gradient marketing canvas at store dimensions.
# Manual / on-demand only - it boots simulators + an emulator and is slow.
# Artifacts (doc/marketing + doc/screenshots) are attached to the run.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets (space-separated): app example'
        default: 'app example'
      apple_platforms:
        description: 'Apple platforms: ios macos'
        default: 'ios macos'
      windows_only:
        description: 'Capture only the Windows app for Microsoft Store'
        type: boolean
        default: false
      source_ref:
        description: 'Windows app source ref (e.g. app-v4.5.0); blank uses this workflow commit'
        default: ''

permissions:
  contents: read

jobs:
  # iOS (simctl) + macOS (window crop) on a macOS runner with a GUI session.
  apple:
    if: ${{ !inputs.windows_only }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: Install rsvg-convert (marketing compose)
        run: brew install librsvg
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Capture + compose (iOS, macOS)
        # macOS window cropping queries window bounds via System Events; if the
        # runner's automation permission blocks it the capture falls back to a
        # full-display grab (documented in doc/screenshots/README.md). iOS uses
        # simctl and never needs automation.
        run: |
          packages/dart_pdf_editor/example/tool/screenshots.sh \
            ${{ github.event.inputs.targets }} ${{ github.event.inputs.apple_platforms }}
      - uses: actions/upload-artifact@v7
        with:
          name: marketing-apple
          path: |
            doc/marketing/**
            doc/screenshots/**
          if-no-files-found: warn

  # Android via an emulator on Linux (KVM-accelerated).
  android:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: Install rsvg-convert (marketing compose)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture + compose (Android)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            packages/dart_pdf_editor/example/tool/screenshots.sh \
              ${{ github.event.inputs.targets }} android
      - uses: actions/upload-artifact@v7
        with:
          name: marketing-android
          path: |
            doc/marketing/**
            doc/screenshots/**
          if-no-files-found: warn

  windows:
    if: ${{ inputs.windows_only }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Build the actual release's UI, with only the capture harness overlaid.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: screenshot-source
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: Prepare capture harness
        shell: pwsh
        run: |
          Copy-Item app/tool/screenshots_main.dart screenshot-source/app/tool/screenshots_main.dart -Force
      - name: Resolve workspace dependencies
        working-directory: screenshot-source
        run: flutter pub get
      - name: Build Windows capture app
        working-directory: screenshot-source/app
        shell: pwsh
        run: |
          flutter build windows --release -t tool/screenshots_main.dart
          if ($LASTEXITCODE -ne 0) { throw 'Windows screenshot build failed' }
      - name: Capture native Windows scenes
        shell: pwsh
        run: |
          ./app/tool/capture_windows_screenshots.ps1 -SourceRoot screenshot-source -OutputDirectory doc/screenshots/app/windows
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-windows
          path: doc/screenshots/app/windows/
          if-no-files-found: error
