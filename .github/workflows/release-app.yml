name: Release app

# Builds installable artifacts for the standalone DartPDF app on every
# `app-v*` tag (and on demand) and attaches them to a draft GitHub Release.
# Store upload and code signing stay manual - see app/RELEASING.md.

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 0.1.0'
        required: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'
  APPIMAGETOOL_SHA256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == app-v* ]]; then
            V="${REF#app-v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=${V:-0.1.0}" >> "$GITHUB_OUTPUT"

  android:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Patch hosted Android plugin compatibility
        run: |
          set -euo pipefail

          patch_gradle() {
            local gradle_file="$1"
            local namespace="${2:-}"
            if [[ -z "$gradle_file" ]]; then
              echo "No matching hosted Android Gradle file found; skipping patch."
              return 0
            fi

            python3 - "$gradle_file" "$namespace" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          namespace = sys.argv[2]
          text = path.read_text()
          text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
          if namespace and 'namespace ' not in text:
              text = text.replace('android {\n', f'android {{\n    namespace "{namespace}"\n', 1)
          path.write_text(text)
          PY
          }

          # Patch EVERY match, not just the first: `-print -quit` can return a
          # plugin's example/android/build.gradle instead of its own (find's
          # order is filesystem-dependent), which leaves the real plugin
          # unpatched and fails :onnxruntime:checkReleaseAarMetadata.
          while IFS= read -r f; do patch_gradle "$f"; done < <(find "$HOME/.pub-cache" -path '*/onnxruntime-*/android/build.gradle')
          while IFS= read -r f; do patch_gradle "$f" dev.irondash.engine_context; done < <(find "$HOME/.pub-cache" -path '*/irondash_engine_context-*/android/build.gradle')
          super_native_gradle="$(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle' -print -quit)"
          while IFS= read -r f; do patch_gradle "$f" com.superlist.super_native_extensions; done < <(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle')

          if [[ -n "$super_native_gradle" ]]; then
            cargokit_gradle="$(dirname "$super_native_gradle")/../cargokit/gradle/plugin.gradle"
          else
            cargokit_gradle=""
          fi

          if [[ -n "$cargokit_gradle" && -f "$cargokit_gradle" ]]; then
            python3 - "$cargokit_gradle" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace('for (project in projects) {', 'for (project in projects.values()) {')
          text = text.replace('project.value.getPlugins()', 'project.getPlugins()')
          text = text.replace(
              'return _findFlutterPlugin(project.value.childProjects);',
              '''def found = _findFlutterPlugin(project.childProjects);
                      if (found != null) {
                          return found;
                      }''',
          )
          if 'projects.values()' not in text or 'project.value.getPlugins()' in text:
              raise SystemExit("CargoKit plugin patch target not found")
          path.write_text(text)
          PY
          else
            echo "No CargoKit Gradle plugin found; skipping patch."
          fi
      - name: Build APK + AAB
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name=${{ needs.setup.outputs.version }} --build-number=${{ github.run_number }}
          flutter build appbundle --release \
            --build-name=${{ needs.setup.outputs.version }} --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

  web:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        working-directory: app
        run: |
          dart run dart_pdf_editor:build_web_worker \
            --out ../packages/dart_pdf_editor_assets/assets/web/pdf_render_worker.dart.js
          flutter build web --release
      - name: Cache-bust web build
        working-directory: app
        run: bash ../tool/web_cache_bust.sh build/web
      - name: Zip
        working-directory: app
        run: (cd build/web && zip -r ../../dartpdf-web.zip .)
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: app/dartpdf-web.zip

  linux:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb x11-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux
        working-directory: app
        run: |
          flutter build linux --release --build-name=${{ needs.setup.outputs.version }} --build-number=${{ github.run_number }} --dart-define=PDF_BUILD_COMMIT=${{ github.sha }}
          build/linux/x64/release/bundle/dartpdf-cli --version
      - name: Tar bundle (portable folder)
        working-directory: app
        # The bundle now carries the desktop-integration files under share/
        # (app/linux/CMakeLists.txt installs the .desktop, AppStream metainfo,
        # and hicolor icons), so this tarball is what app/packaging/flatpak
        # unpacks. Archiving the whole bundle dir includes them automatically.
        run: tar czf dartpdf-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Build AppImage (single portable file)
        working-directory: app
        run: |
          set -euo pipefail
          APPDIR=DartPDF.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/bin/"
          cp ../doc/logo.png "$APPDIR/dartpdf.png"
          cat > "$APPDIR/dartpdf.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DartPDF
          Exec=dart_pdf_editor_app
          Icon=dartpdf
          Categories=Office;Utility;
          MimeType=application/pdf;
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/bin/dart_pdf_editor_app" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          curl -fsSL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APPDIR" dartpdf-linux-x86_64.AppImage

      - name: Smoke-test Linux GUI bundle
        run: |
          tool/smoke_test_linux_gui.sh \
            --cmd "app/build/linux/x64/release/bundle/dart_pdf_editor_app" \
            --timeout 15

      - name: Smoke-test Linux AppImage GUI
        working-directory: app
        run: |
          ../tool/smoke_test_linux_gui.sh \
            --cmd "./dartpdf-linux-x86_64.AppImage --appimage-extract-and-run" \
            --timeout 15
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            app/dartpdf-linux-x64.tar.gz
            app/dartpdf-linux-x86_64.AppImage

  windows:
    needs: setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        working-directory: app
        shell: pwsh
        run: |
          flutter build windows --release --build-name=${{ needs.setup.outputs.version }} --build-number=${{ github.run_number }} --dart-define=PDF_BUILD_COMMIT=${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "flutter build windows failed ($LASTEXITCODE)" }
          & build/windows/x64/runner/Release/dartpdf.exe --version
          if ($LASTEXITCODE -ne 0) { throw "dartpdf.exe smoke check failed ($LASTEXITCODE)" }
      - name: Smoke-test Windows GUI launch
        working-directory: app
        shell: pwsh
        # Launch the GUI executable and require it to survive the window: a
        # startup crash (plugin registration, missing DLL) exits immediately.
        run: |
          $exe = "build/windows/x64/runner/Release/dart_pdf_editor_app.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 12
          $p.Refresh()
          if ($p.HasExited) {
            throw "dart_pdf_editor_app.exe exited during smoke launch (code $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force
          echo "App still running after 12s - startup OK."
      - name: Bundle MSVC runtime (makes the folder portable on clean PCs)
        working-directory: app
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          Copy-Item "$env:SystemRoot\System32\msvcp140.dll",
                    "$env:SystemRoot\System32\vcruntime140.dll",
                    "$env:SystemRoot\System32\vcruntime140_1.dll" `
                    -Destination $rel -Force
      - name: Zip portable folder
        working-directory: app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dartpdf-windows-x64.zip -Force
      - name: Build self-extracting portable exe (NSIS)
        working-directory: app
        shell: pwsh
        run: |
          $rel = (Resolve-Path "build/windows/x64/runner/Release").Path
          $nsi = @"
          Unicode true
          Name "DartPDF"
          OutFile "dartpdf-windows-portable.exe"
          SilentInstall silent
          RequestExecutionLevel user
          Section
            InitPluginsDir
            SetOutPath "`$PLUGINSDIR\DartPDF"
            File /r "$rel\*.*"
            ExecWait '"`$PLUGINSDIR\DartPDF\dart_pdf_editor_app.exe"'
          SectionEnd
          "@
          Set-Content -Path portable.nsi -Value $nsi -Encoding UTF8
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress | Out-Null }
          & $makensis portable.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          if (-not (Test-Path dartpdf-windows-portable.exe)) { throw "portable exe not produced" }
      - name: Build Windows installer (NSIS)
        working-directory: app
        shell: pwsh
        run: |
          $rel = (Resolve-Path "build/windows/x64/runner/Release").Path
          $version = "${{ needs.setup.outputs.version }}"
          $versionDigits = $version -replace '[^0-9.].*$', ''
          $versionParts = @($versionDigits.Split('.') | Where-Object { $_ -match '^\d+$' })
          while ($versionParts.Count -lt 4) { $versionParts += '0' }
          $fileVersion = ($versionParts[0..3] -join '.')
          $nsi = @"
          Unicode true
          !include "MUI2.nsh"
          !define MUI_ABORTWARNING

          Name "DartPDF"
          OutFile "dartpdf-windows-installer.exe"
          InstallDir "`$LOCALAPPDATA\Programs\DartPDF"
          InstallDirRegKey HKCU "Software\DartPDF" "InstallDir"
          RequestExecutionLevel user

          VIProductVersion "$fileVersion"
          VIAddVersionKey "ProductName" "DartPDF"
          VIAddVersionKey "CompanyName" "DartPDF"
          VIAddVersionKey "FileDescription" "DartPDF installer"
          VIAddVersionKey "ProductVersion" "$version"
          VIAddVersionKey "FileVersion" "$version"

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "DartPDF" SecInstall
            SetShellVarContext current
            SetOutPath "`$INSTDIR"
            File /r "$rel\*.*"

            CreateDirectory "`$SMPROGRAMS\DartPDF"
            CreateShortcut "`$SMPROGRAMS\DartPDF\DartPDF.lnk" "`$INSTDIR\dart_pdf_editor_app.exe"
            CreateShortcut "`$SMPROGRAMS\DartPDF\Uninstall DartPDF.lnk" "`$INSTDIR\Uninstall.exe"

            WriteUninstaller "`$INSTDIR\Uninstall.exe"

            WriteRegStr HKCU "Software\DartPDF" "InstallDir" "`$INSTDIR"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\DartPDF" "DisplayName" "DartPDF"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\DartPDF" "DisplayVersion" "$version"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\DartPDF" "Publisher" "DartPDF"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\DartPDF" "InstallLocation" "`$INSTDIR"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\DartPDF" "DisplayIcon" "`$INSTDIR\dart_pdf_editor_app.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\DartPDF" "UninstallString" '"`$INSTDIR\Uninstall.exe"'
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\DartPDF" "QuietUninstallString" '"`$INSTDIR\Uninstall.exe" /S'
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\DartPDF" "NoModify" 1
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\DartPDF" "NoRepair" 1

            WriteRegStr HKCU "Software\Classes\DartPDF.pdf" "" "PDF document"
            WriteRegStr HKCU "Software\Classes\DartPDF.pdf\DefaultIcon" "" "`$INSTDIR\dart_pdf_editor_app.exe,-102"
            WriteRegStr HKCU "Software\Classes\DartPDF.pdf\shell\open\command" "" '"`$INSTDIR\dart_pdf_editor_app.exe" "%1"'
            WriteRegStr HKCU "Software\Classes\.pdf\OpenWithProgids" "DartPDF.pdf" ""
            System::Call 'shell32::SHChangeNotify(i 0x08000000, i 0, i 0, i 0)'
          SectionEnd

          Section "Uninstall"
            SetShellVarContext current
            Delete "`$SMPROGRAMS\DartPDF\DartPDF.lnk"
            Delete "`$SMPROGRAMS\DartPDF\Uninstall DartPDF.lnk"
            RMDir "`$SMPROGRAMS\DartPDF"

            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\DartPDF"
            DeleteRegKey HKCU "Software\DartPDF"
            DeleteRegKey HKCU "Software\Classes\DartPDF.pdf"
            DeleteRegValue HKCU "Software\Classes\.pdf\OpenWithProgids" "DartPDF.pdf"

            RMDir /r "`$INSTDIR"
            System::Call 'shell32::SHChangeNotify(i 0x08000000, i 0, i 0, i 0)'
          SectionEnd
          "@
          Set-Content -Path installer.nsi -Value $nsi -Encoding UTF8
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress | Out-Null }
          & $makensis installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          if (-not (Test-Path dartpdf-windows-installer.exe)) { throw "installer exe not produced" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            app/dartpdf-windows-x64.zip
            app/dartpdf-windows-portable.exe
            app/dartpdf-windows-installer.exe

  macos_cli:
    name: Build macOS CLI (${{ matrix.arch }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile native CLI/MCP slice
        run: |
          dart tool/build_desktop_cli.dart \
            --output app/build/dartpdf-cli/dartpdf-${{ matrix.arch }} \
            --target-os macos \
            --target-arch ${{ matrix.arch }}
          file app/build/dartpdf-cli/dartpdf-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: macos-cli-${{ matrix.arch }}
          path: app/build/dartpdf-cli/dartpdf-${{ matrix.arch }}

  macos:
    needs: [setup, macos_cli]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Neutralize code signing for the unsigned CI build (runner-only)
        working-directory: app
        # The committed pbxproj carries Automatic signing + the RES team so the
        # local App Store archive can distribution-sign. CI has no Apple account
        # and only produces an ad-hoc DMG, so patch the runner's copy back to
        # ad-hoc (matching how the Android job patches hosted plugins on-runner).
        run: |
          sed -i '' \
            -e 's/"Apple Development"/"-"/g' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/DEVELOPMENT_TEAM = N5K9GK8B27;/DEVELOPMENT_TEAM = "";/g' \
            macos/Runner.xcodeproj/project.pbxproj
      - name: Build macOS
        working-directory: app
        run: flutter build macos --release --build-name=${{ needs.setup.outputs.version }} --build-number=${{ github.run_number }} --dart-define=PDF_BUILD_COMMIT=${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-cli-*
          path: app/build/dartpdf-cli-slices
          merge-multiple: true
      - name: Install universal CLI/MCP sidecar
        working-directory: app
        run: |
          /usr/bin/lipo -create \
            build/dartpdf-cli-slices/dartpdf-arm64 \
            build/dartpdf-cli-slices/dartpdf-x64 \
            -output build/macos/Build/Products/Release/DartPDF.app/Contents/MacOS/dartpdf-cli
          chmod 755 build/macos/Build/Products/Release/DartPDF.app/Contents/MacOS/dartpdf-cli
          dart ../tool/sanitize_macho.dart build/macos/Build/Products/Release/DartPDF.app/Contents/MacOS/dartpdf-cli
          /usr/bin/lipo -info build/macos/Build/Products/Release/DartPDF.app/Contents/MacOS/dartpdf-cli
          build/macos/Build/Products/Release/DartPDF.app/Contents/MacOS/dartpdf-cli --version
      - name: Ad-hoc sign macOS app with distributable entitlements
        working-directory: app
        env:
          CODESIGN_ENTITLEMENTS: macos/Runner/AdHoc.entitlements
        run: bash macos/resign_embedded_code.sh build/macos/Build/Products/Release/DartPDF.app
      - name: Smoke-test macOS app launch
        working-directory: app
        # Launch the signed .app directly and require it to survive the window:
        # a startup crash (plugin registration, missing dylib) exits the process
        # immediately. The runner's GUI session lets the app create its window.
        run: |
          set -euo pipefail
          bin="build/macos/Build/Products/Release/DartPDF.app/Contents/MacOS/DartPDF"
          "$bin" >"$RUNNER_TEMP/dartpdf-macos-smoke.log" 2>&1 &
          pid=$!
          sleep 12
          if kill -0 "$pid" 2>/dev/null; then
            echo "App still running after 12s - startup OK."
            kill "$pid" 2>/dev/null || true
          else
            status=0
            wait "$pid" || status=$?
            cat "$RUNNER_TEMP/dartpdf-macos-smoke.log" || true
            echo "macOS app exited during smoke launch (status $status)" >&2
            exit 1
          fi
      - name: Package DMG (unsigned)
        working-directory: app
        run: |
          rm -rf build/dmg-root
          mkdir -p build/dmg-root
          cp -R "build/macos/Build/Products/Release/DartPDF.app" build/dmg-root/
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname "DartPDF" \
            -srcfolder build/dmg-root \
            -ov -format UDZO dartpdf-macos.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: app/dartpdf-macos.dmg

  ios:
    needs: setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign --build-name=${{ needs.setup.outputs.version }} --build-number=${{ github.run_number }}
      - name: Zip unsigned .app
        working-directory: app
        run: ditto -c -k --keepParent "build/ios/iphoneos/Runner.app" dartpdf-ios-unsigned.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: app/dartpdf-ios-unsigned.zip

  release:
    needs: [setup, android, web, linux, windows, macos, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/app-v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          name: DartPDF ${{ needs.setup.outputs.version }}
          draft: true
          # The macos-cli-* artifacts are internal slices used to create the
          # universal sidecar; only user-facing package artifacts are released.
          files: |
            artifacts/android/**/*
            artifacts/web/**/*
            artifacts/linux/**/*
            artifacts/windows/**/*
            artifacts/macos/**/*
            artifacts/ios/**/*
          body: |
            Standalone DartPDF ${{ needs.setup.outputs.version }}.

            Artifacts are built by CI and are **unsigned** (macOS .dmg, iOS .app,
            Windows installer/.zip) or **debug-signed** (Android, unless a release keystore
            is configured). See `app/RELEASING.md` for signing and store upload.
