name: Release app

# Operational branch only: retained bytes to an existing DRAFT, never a build
# or publication. Do not merge this one-off workflow into the default branch.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: app-v15-large-upload-recovery-435075074
  cancel-in-progress: false

jobs:
  upload-retained-android:
    if: >-
      github.repository == 'ben-milanko/dart-pdf' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/release/15-large-upload-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify retained provenance and recover missing draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          GH_PROMPT_DISABLED: '1'
        run: python3 .github/recovery/upload_retained_android.py
