name: CI

on:
  push:
    branches: [main, deploy]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      # Run before pub get on purpose: the formatter wrapper must preserve the
      # workspace's Dart 3.5 style even when package_config.json does not exist.
      - name: Check fresh-worktree formatter contract
        run: dart tool/format.dart --output=none --set-exit-if-changed tool/format.dart
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - name: Test Patrol performance summarizer
        run: dart tool/patrol_perf_summary_test.dart
      - name: Test Flutter GPU corpus summarizer
        run: dart tool/gpu_corpus_summary_test.dart
      # Enforce the lockstep versioning invariant: every workspace package
      # must depend on its siblings at the current release version (`^x.y.z`).
      # A stale lower bound makes pub.dev's downgrade analysis fail (0/20 on
      # "compatible with dependency constraint lower bounds"). See the script
      # header and dart.dev/go/downgrade-testing.
      - name: Check lockstep dependency lower bounds
        run: dart run tool/check_lockstep_constraints.dart
      # Every non-English ARB must have 100% key coverage against its _en.arb
      # template. gen-l10n silently falls back to English for missing keys, so
      # a half-translated locale would otherwise ship looking finished. See
      # tool/check_arb_coverage.dart and doc/i18n.md.
      - name: Check ARB translation coverage
        run: dart run tool/check_arb_coverage.dart
      # Deterministic perf counter gate: structural work counters (objects
      # loaded, bytes decoded, content ops, ...) over fixed inputs vs the
      # committed baseline. No wall time, so a noisy shared runner cannot
      # flake it. Re-baseline deliberately with
      # `tool/perf.sh gate --update-baseline`.
      - name: Perf counter gate
        working-directory: packages/pdf_graphics
        run: dart run tool/perf_count_gate.dart
      # Prove the PdfPerf facade's kill switch still dead-code-eliminates:
      # -DPDF_PERF=false must strip the marker from compiled JS.
      - name: Perf facade DCE check
        run: tool/check_perf_dce.sh
      - name: Activate coverage tool
        run: dart pub global activate coverage

      - name: Test pdf_cos
        working-directory: packages/pdf_cos
        run: |
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --packages=../../.dart_tool/package_config.json
      - name: Upload pdf_cos coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/pdf_cos/coverage/lcov.info
          flags: pdf_cos
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test pdf_document
        working-directory: packages/pdf_document
        run: |
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --packages=../../.dart_tool/package_config.json
      - name: Upload pdf_document coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/pdf_document/coverage/lcov.info
          flags: pdf_document
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test pdf_graphics
        working-directory: packages/pdf_graphics
        run: |
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --packages=../../.dart_tool/package_config.json
      - name: Upload pdf_graphics coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/pdf_graphics/coverage/lcov.info
          flags: pdf_graphics
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test dart_pdf_cli
        working-directory: packages/dart_pdf_cli
        run: |
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --packages=../../.dart_tool/package_config.json
      - name: Upload dart_pdf_cli coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/dart_pdf_cli/coverage/lcov.info
          flags: dart_pdf_cli
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test dart_pdf_editor
        working-directory: packages/dart_pdf_editor
        run: flutter test --coverage
      - name: Upload dart_pdf_editor coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/dart_pdf_editor/coverage/lcov.info
          flags: dart_pdf_editor
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Every other render test here runs on Skia, but the shipped Android app
      # runs on Impeller - which honours a slightly different subset of the
      # canvas API (issue #675: a draw paint's blend mode is dropped when the
      # same paint carries a colour filter). Run the compositing tests that
      # encode those invariants on Impeller too, so the divergence is caught
      # here rather than on a device.
      - name: Test dart_pdf_editor compositing on Impeller
        working-directory: packages/dart_pdf_editor
        run: flutter test --enable-impeller test/image_soft_mask_composite_test.dart

      # The optional flutter_gpu tile backend is the default wherever the
      # platform supports it (Android ships with it enabled), and its corpus
      # suite asserts GPU/Canvas parity on every page it accepts. Every
      # assertion self-skips when the runner cannot open a GPU context, so this
      # is a no-op rather than a failure on a host without one.
      - name: Test dart_pdf_editor_flutter_gpu
        working-directory: packages/dart_pdf_editor_flutter_gpu
        run: flutter test --enable-impeller --enable-flutter-gpu

      - name: Test pdf_ocr_vlm
        working-directory: packages/pdf_ocr_vlm
        run: flutter test --coverage
      - name: Upload pdf_ocr_vlm coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/pdf_ocr_vlm/coverage/lcov.info
          flags: pdf_ocr_vlm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test DartPDF app
        working-directory: app
        run: flutter test --coverage
      - name: Upload app coverage
        uses: codecov/codecov-action@v7
        with:
          files: app/coverage/lcov.info
          flags: app
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The broad GPU suite above deliberately self-skips on Linux runners without
  # an Impeller context. This designated Metal lane is the non-optional proof:
  # the checked-in Flutter-3.47 shader bundle must load, an accepted scene must
  # create a session and render a tile, and the pixels must agree with Canvas.
  flutter-gpu-smoke:
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Require a real flutter_gpu tile
        working-directory: packages/dart_pdf_editor_flutter_gpu
        run: >-
          flutter test --enable-impeller --enable-flutter-gpu
          --dart-define PDF_GPU_CI_SMOKE=true
          test/gpu_ci_smoke_test.dart --reporter expanded

      - name: Validate native system-font GPU corpus parity
        working-directory: packages/dart_pdf_editor_flutter_gpu
        env:
          GPU_CORPUS_REPORT: ${{ runner.temp }}/flutter-gpu-corpus-pr.json
          GPU_CORPUS_SYSTEM_TEXT: 1
          GPU_CORPUS_REGISTER_SYSTEM_FONTS: 1
        run: >-
          flutter test --enable-impeller --enable-flutter-gpu
          test/gpu_corpus_test.dart --reporter expanded

      - name: Prepare same-host main Flutter GPU baseline
        id: gpu-baseline
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A separate workflow artifact can come from a materially faster or
          # slower macOS host. Keep the exact base revision on this runner so
          # the comparison isolates code instead of fleet variance.
          destination="$RUNNER_TEMP/flutter-gpu-main"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$destination" "$BASE_SHA"
          (
            cd "$destination"
            flutter pub get
          )
          echo "dir=$destination" >> "$GITHUB_OUTPUT"
          echo "commit=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Measure main Flutter GPU corpus routes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_WORKSPACE: ${{ steps.gpu-baseline.outputs.dir }}
          GPU_CORPUS_REPORT: ${{ runner.temp }}/flutter-gpu-corpus-main.json
          GPU_CORPUS_SYSTEM_TEXT: 1
          GPU_CORPUS_REGISTER_SYSTEM_FONTS: 1
        run: |
          set -euo pipefail
          cd "$BASE_WORKSPACE/packages/dart_pdf_editor_flutter_gpu"
          flutter test --enable-impeller --enable-flutter-gpu \
            test/gpu_corpus_test.dart --reporter expanded

      - name: Compare Flutter GPU corpus routes with main
        if: github.event_name == 'pull_request'
        working-directory: packages/dart_pdf_editor_flutter_gpu
        shell: bash
        run: >-
          dart ../../tool/gpu_corpus_summary.dart
          "$RUNNER_TEMP/flutter-gpu-corpus-main.json"
          "$RUNNER_TEMP/flutter-gpu-corpus-pr.json"
          --output test-results/gpu
          --markdown "$GITHUB_STEP_SUMMARY"

      - name: Measure Flutter GPU warm-up and first-tile performance
        id: gpu-performance
        working-directory: packages/dart_pdf_editor_flutter_gpu
        shell: bash
        env:
          PERF_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_COMMIT: ${{ steps.gpu-baseline.outputs.commit }}
          BASE_WORKSPACE: ${{ steps.gpu-baseline.outputs.dir }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/flutter-gpu-performance.log"
          baseline_log="$RUNNER_TEMP/flutter-gpu-main-performance.log"
          stress_pdf="$RUNNER_TEMP/flutter-gpu-advanced-blend-stress.pdf"
          : > "$log"
          : > "$baseline_log"
          # Generate once in the PR worktree, then give this absolute path to
          # both test binaries so the first introducing PR has a valid base.
          dart tool/advanced_blend_stress_fixture.dart "$stress_pdf"

          run_case() {
            local workspace="$1"
            local commit="$2"
            local destination_log="$3"
            local cohort="$4"
            local label="$5"
            local source_kind="$6"
            local source="$7"
            local repetition="$8"
            local source_env
            local route_change=0
            if [[ "$label" == "vector-mask" ||
                  "$label" == "vector-stack-1" ||
                  "$label" == "vector-stack-2" ||
                  "$label" == "text-mask-1" ||
                  "$label" == "text-mask-2" ||
                  "$label" == "advanced-blend" ||
                  "$label" == "advanced-blend-stress" ||
                  "$label" == "knockout-mask" ||
                  "$label" == "knockout-overlap" ||
                  "$label" == "overprint-retry" ||
                  "$label" == "hairline" ]]; then
              route_change=1
            fi
            local system_text=0
            if [[ "$label" == "system-text" ||
                  "$label" == "cjk-text" ||
                  "$label" == "advanced-blend" ]]; then
              system_text=1
            fi
            case "$source_kind" in
              pdf)
                source_env="PDF_GPU_BENCHMARK_PDF=$source"
                ;;
              fixture)
                source_env="PDF_GPU_BENCHMARK_FIXTURE=$source"
                ;;
              generated)
                source_env="PDF_GPU_BENCHMARK_PDF=$stress_pdf"
                ;;
              *)
                echo "Unknown Flutter GPU benchmark source kind: $source_kind" >&2
                return 2
                ;;
            esac
            echo "::group::Flutter GPU $cohort $label $repetition"
            (
              cd "$workspace/packages/dart_pdf_editor_flutter_gpu"
              env \
                "$source_env" \
                PDF_GPU_BENCHMARK_PAGES=0 \
                PDF_GPU_BENCHMARK_WARMUP=1 \
                PDF_GPU_BENCHMARK_SCENE_WARMUP=1 \
                PDF_GPU_BENCHMARK_OVERPRINT=0 \
                PDF_GPU_BENCHMARK_ROUTE_CHANGE="$route_change" \
                PDF_GPU_BENCHMARK_SYSTEM_TEXT="$system_text" \
                PDF_GPU_BENCHMARK_REGISTER_SYSTEM_FONTS="$system_text" \
                PDF_GPU_BENCHMARK_SCENARIO="$label" \
                flutter test \
                  --enable-impeller \
                  --enable-flutter-gpu \
                  --dart-define PDF_PERF_LOG=true \
                  --dart-define "PDF_BUILD_COMMIT=$commit" \
                  test/real_document_benchmark_test.dart \
                  --reporter expanded
            ) 2>&1 | tee -a "$destination_log"
            echo "::endgroup::"
          }

          if [[ -n "$BASE_WORKSPACE" ]]; then
            prime_index=0
            while read -r label source_kind source; do
              # The PR worktree already ran gpu_ci_smoke_test.dart. Prime both
              # worktrees here so compilation and Metal driver caches cannot
              # systematically favour the candidate measurements.
              if (( prime_index % 2 == 0 )); then
                run_case "$BASE_WORKSPACE" "$BASE_COMMIT" /dev/null \
                  main "$label" "$source_kind" "$source" "unmeasured warm-up"
                run_case "$GITHUB_WORKSPACE" "$PERF_COMMIT" /dev/null \
                  pr "$label" "$source_kind" "$source" "unmeasured warm-up"
              else
                run_case "$GITHUB_WORKSPACE" "$PERF_COMMIT" /dev/null \
                  pr "$label" "$source_kind" "$source" "unmeasured warm-up"
                run_case "$BASE_WORKSPACE" "$BASE_COMMIT" /dev/null \
                  main "$label" "$source_kind" "$source" "unmeasured warm-up"
              fi
              prime_index=$((prime_index + 1))
            done <<'SCENARIOS'
          tiling pdf ../../test_corpora/pdfjs/tiling-pattern-box.pdf
          type3-triangles pdf ../../test_corpora/pdfjs/Type3WordSpacing.pdf
          radial pdf ../../test_corpora/ghent/1-CMYK/GWG060_Shading_x1a.pdf
          deferred-mask fixture deferred-mask
          vector-mask pdf ../../test_corpora/pdfjs/smask_luminosity_oob_transfer.pdf
          vector-stack-1 pdf ../../test_corpora/ghent/1-CMYK/GWG168_Softmasks_Vector_part1_X4.pdf
          vector-stack-2 pdf ../../test_corpora/ghent/1-CMYK/GWG169_Softmasks_Vector_part2_X4.pdf
          text-mask-1 pdf ../../test_corpora/ghent/1-CMYK/GWG1610_Softmasks_Text_part1_X4.pdf
          text-mask-2 pdf ../../test_corpora/ghent/1-CMYK/GWG1611_Softmasks_Text_part2_X4.pdf
          system-text pdf ../../test_corpora/pdfjs/hello_world_rotated.pdf
          cjk-text pdf ../../test_corpora/pdfjs/SimFang-variant.pdf
          advanced-blend pdf ../../test_corpora/pdfjs/blendmode.pdf
          advanced-blend-stress generated advanced-blend-stress
          knockout-mask pdf ../../test_corpora/pdfjs/knockout_smask.pdf
          knockout-overlap pdf ../../test_corpora/pdfjs/knockout_isolated_overlap.pdf
          overprint-retry pdf ../../test_corpora/ghent/3-ICC-CMS/GWG164_Transp_Basic_BM_ICCbasedCMYK_x4.pdf
          hairline pdf ../../test_corpora/pdfjs/issue3458.pdf
          SCENARIOS
          fi

          for iteration in 1 2 3 4 5 6; do
            while read -r label source_kind source; do
              # Even repetitions run PR first, odd repetitions run main first:
              # each cohort inherits the warmer state exactly three times.
              if [[ -n "$BASE_WORKSPACE" && $((iteration % 2)) == 0 ]]; then
                run_case "$GITHUB_WORKSPACE" "$PERF_COMMIT" "$log" \
                  pr "$label" "$source_kind" "$source" "repetition $iteration/6"
                run_case "$BASE_WORKSPACE" "$BASE_COMMIT" "$baseline_log" \
                  main "$label" "$source_kind" "$source" "repetition $iteration/6"
              elif [[ -n "$BASE_WORKSPACE" ]]; then
                run_case "$BASE_WORKSPACE" "$BASE_COMMIT" "$baseline_log" \
                  main "$label" "$source_kind" "$source" "repetition $iteration/6"
                run_case "$GITHUB_WORKSPACE" "$PERF_COMMIT" "$log" \
                  pr "$label" "$source_kind" "$source" "repetition $iteration/6"
              else
                run_case "$GITHUB_WORKSPACE" "$PERF_COMMIT" "$log" \
                  current "$label" "$source_kind" "$source" "repetition $iteration/6"
              fi
            done <<'SCENARIOS'
          tiling pdf ../../test_corpora/pdfjs/tiling-pattern-box.pdf
          type3-triangles pdf ../../test_corpora/pdfjs/Type3WordSpacing.pdf
          radial pdf ../../test_corpora/ghent/1-CMYK/GWG060_Shading_x1a.pdf
          deferred-mask fixture deferred-mask
          vector-mask pdf ../../test_corpora/pdfjs/smask_luminosity_oob_transfer.pdf
          vector-stack-1 pdf ../../test_corpora/ghent/1-CMYK/GWG168_Softmasks_Vector_part1_X4.pdf
          vector-stack-2 pdf ../../test_corpora/ghent/1-CMYK/GWG169_Softmasks_Vector_part2_X4.pdf
          text-mask-1 pdf ../../test_corpora/ghent/1-CMYK/GWG1610_Softmasks_Text_part1_X4.pdf
          text-mask-2 pdf ../../test_corpora/ghent/1-CMYK/GWG1611_Softmasks_Text_part2_X4.pdf
          system-text pdf ../../test_corpora/pdfjs/hello_world_rotated.pdf
          cjk-text pdf ../../test_corpora/pdfjs/SimFang-variant.pdf
          advanced-blend pdf ../../test_corpora/pdfjs/blendmode.pdf
          advanced-blend-stress generated advanced-blend-stress
          knockout-mask pdf ../../test_corpora/pdfjs/knockout_smask.pdf
          knockout-overlap pdf ../../test_corpora/pdfjs/knockout_isolated_overlap.pdf
          overprint-retry pdf ../../test_corpora/ghent/3-ICC-CMS/GWG164_Transp_Basic_BM_ICCbasedCMYK_x4.pdf
          hairline pdf ../../test_corpora/pdfjs/issue3458.pdf
          SCENARIOS
          done
          echo "log=$log" >> "$GITHUB_OUTPUT"
          if [[ -n "$BASE_WORKSPACE" ]]; then
            echo "baseline_log=$baseline_log" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize Flutter GPU performance
        if: always()
        working-directory: packages/dart_pdf_editor_flutter_gpu
        shell: bash
        run: |
          set -euo pipefail
          log="${{ steps.gpu-performance.outputs.log }}"
          if [[ -z "$log" || ! -f "$log" ]]; then
            log="$RUNNER_TEMP/flutter-gpu-performance.log"
            touch "$log"
          fi
          requirements=(
            --require-scenario-runs gpu-tiling-pipeline-warm=6
            --require-scenario-runs gpu-tiling-page-0-scene-warm=6
            --require-scenario-runs gpu-tiling-page-0-first-tile=6
            --require-scenario-runs gpu-tiling-page-0-canvas-tile=6
            --require-scenario-runs gpu-type3-triangles-pipeline-warm=6
            --require-scenario-runs gpu-type3-triangles-page-0-scene-warm=6
            --require-scenario-runs gpu-type3-triangles-page-0-first-tile=6
            --require-scenario-runs gpu-type3-triangles-page-0-canvas-tile=6
            --require-scenario-runs gpu-radial-pipeline-warm=6
            --require-scenario-runs gpu-radial-page-0-scene-warm=6
            --require-scenario-runs gpu-radial-page-0-first-tile=6
            --require-scenario-runs gpu-radial-page-0-canvas-tile=6
            --require-scenario-runs gpu-deferred-mask-page-0-first-tile=6
            --require-scenario-runs gpu-deferred-mask-page-0-canvas-tile=6
            --require-scenario-runs gpu-vector-mask-page-0-first-tile=6
            --require-scenario-runs gpu-vector-mask-page-0-canvas-tile=6
            --require-scenario-runs gpu-vector-stack-1-page-0-first-tile=6
            --require-scenario-runs gpu-vector-stack-1-page-0-canvas-tile=6
            --require-scenario-runs gpu-vector-stack-2-page-0-first-tile=6
            --require-scenario-runs gpu-vector-stack-2-page-0-canvas-tile=6
            --require-scenario-runs gpu-text-mask-1-page-0-first-tile=6
            --require-scenario-runs gpu-text-mask-1-page-0-canvas-tile=6
            --require-scenario-runs gpu-text-mask-2-page-0-first-tile=6
            --require-scenario-runs gpu-text-mask-2-page-0-canvas-tile=6
            --require-scenario-runs gpu-system-text-pipeline-warm=6
            --require-scenario-runs gpu-system-text-page-0-scene-warm=6
            --require-scenario-runs gpu-system-text-page-0-first-tile=6
            --require-scenario-runs gpu-system-text-page-0-canvas-tile=6
            --require-scenario-runs gpu-cjk-text-pipeline-warm=6
            --require-scenario-runs gpu-cjk-text-page-0-scene-warm=6
            --require-scenario-runs gpu-cjk-text-page-0-first-tile=6
            --require-scenario-runs gpu-cjk-text-page-0-canvas-tile=6
            --require-scenario-runs gpu-advanced-blend-page-0-first-tile=6
            --require-scenario-runs gpu-advanced-blend-page-0-canvas-tile=6
            --require-scenario-runs gpu-advanced-blend-stress-page-0-first-tile=6
            --require-scenario-runs gpu-advanced-blend-stress-page-0-canvas-tile=6
            --require-scenario-runs gpu-knockout-mask-page-0-first-tile=6
            --require-scenario-runs gpu-knockout-mask-page-0-canvas-tile=6
            --require-scenario-runs gpu-knockout-overlap-page-0-first-tile=6
            --require-scenario-runs gpu-knockout-overlap-page-0-canvas-tile=6
            --require-scenario-runs gpu-overprint-retry-page-0-first-tile=6
            --require-scenario-runs gpu-overprint-retry-page-0-canvas-tile=6
            --require-scenario-runs gpu-hairline-page-0-first-tile=6
            --require-scenario-runs gpu-hairline-page-0-canvas-tile=6
          )
          arguments=(
            "$log"
            --output test-results/gpu
            --markdown "$GITHUB_STEP_SUMMARY"
            --label "macOS Metal GPU"
            "${requirements[@]}"
          )
          baseline_log="${{ steps.gpu-performance.outputs.baseline_log }}"
          if [[ -n "$baseline_log" && -f "$baseline_log" ]]; then
            baseline_output="$RUNNER_TEMP/flutter-gpu-main-summary"
            dart ../../tool/patrol_perf_summary.dart \
              "$baseline_log" \
              --output "$baseline_output" \
              --markdown "$RUNNER_TEMP/flutter-gpu-main.md" \
              --label "same-host main" \
              "${requirements[@]}"
            baseline="$baseline_output/patrol-perf.json"
            arguments+=(--baseline "$baseline")
          fi
          dart ../../tool/patrol_perf_summary.dart "${arguments[@]}"

      - name: Upload Flutter GPU performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-gpu-performance
          path: packages/dart_pdf_editor_flutter_gpu/test-results/gpu
          if-no-files-found: error

  flutter-gpu-performance-report:
    name: Flutter GPU performance report
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: [flutter-gpu-smoke]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Download Flutter GPU performance report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: flutter-gpu-performance
          path: flutter-gpu-performance

      - name: Comment Flutter GPU performance report
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          GPU_PERF_MARKER: dart-pdf-flutter-gpu-performance
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = `<!-- ${process.env.GPU_PERF_MARKER} -->`;
            const find = (root, name) => {
              if (!fs.existsSync(root)) return null;
              for (const entry of fs.readdirSync(root, {withFileTypes: true})) {
                const candidate = path.join(root, entry.name);
                if (entry.isDirectory()) {
                  const nested = find(candidate, name);
                  if (nested) return nested;
                } else if (entry.name === name) {
                  return candidate;
                }
              }
              return null;
            };
            const headlinePath = find('flutter-gpu-performance', 'patrol-perf-headline.md');
            const reportPath = find('flutter-gpu-performance', 'patrol-perf.md');
            const corpusHeadlinePath = find('flutter-gpu-performance', 'gpu-corpus-headline.md');
            const corpusReportPath = find('flutter-gpu-performance', 'gpu-corpus.md');
            const headline = headlinePath
              ? fs.readFileSync(headlinePath, 'utf8').trim()
              : 'No headline Flutter GPU performance summary was produced.';
            const report = reportPath
              ? fs.readFileSync(reportPath, 'utf8').trim()
              : 'No Flutter GPU performance artifact was produced. Open the workflow run for the failing step and raw logs.';
            const corpusHeadline = corpusHeadlinePath
              ? fs.readFileSync(corpusHeadlinePath, 'utf8').trim()
              : 'No Flutter GPU corpus comparison was produced.';
            const corpusReport = corpusReportPath
              ? fs.readFileSync(corpusReportPath, 'utf8').trim()
              : 'No Flutter GPU corpus report was produced.';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const baseSha = context.payload.pull_request.base.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Flutter GPU validation',
              '',
              `Automated on macOS Metal for commit \`${sha}\` · [workflow run and downloadable traces](${runUrl})`,
              `Same-host A/B: base \`${baseSha}\` and PR were alternated on one GitHub runner.`,
              '',
              corpusHeadline,
              '',
              headline,
              '',
              '<details>',
              '<summary>View Flutter GPU validation details</summary>',
              '',
              corpusReport,
              '',
              report,
              '',
              '</details>',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # The real bundled web render worker
  # (`packages/dart_pdf_editor_assets/assets/web/pdf_render_worker.dart.js`) is a
  # ~1 MB `dart compile js` artifact that is NO LONGER committed (issue #582):
  # only a small stable placeholder is checked in (so the declared Flutter asset
  # always exists for analyze + every native/web build), and the real bundle is
  # regenerated over it at publish (tool/release.sh), at every web deploy/
  # preview/release, and for local web builds (app/tool/build_web.sh). There is
  # therefore nothing to keep in sync, and the old regenerate-and-push machinery
  # (issues #411/#422: the concurrency group, tool/ci/regen_web_worker.sh, and
  # WORKER_REGEN_TOKEN) is gone. This job keeps that machinery's one real value -
  # proving the worker still COMPILES, catching `.toJS`-conversion / dart2js
  # errors `dart analyze` misses (async message handlers) - and guards that the
  # committed file stays the placeholder, so the real blob is never re-committed.
  worker-compiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      # Guard: the checked-in worker asset must stay the small placeholder, not
      # a committed ~1 MB build (the whole point of #582). 8 KB is far above the
      # ~1.5 KB placeholder and far below the ~1 MB real bundle.
      - name: Guard the committed worker stays a placeholder
        run: |
          asset=packages/dart_pdf_editor_assets/assets/web/pdf_render_worker.dart.js
          size=$(wc -c < "$asset")
          echo "committed worker placeholder is ${size} bytes"
          if [ "$size" -gt 8192 ]; then
            echo "::error::$asset is ${size} bytes - the real dart2js bundle was" \
              "committed. Restore the placeholder (git checkout $asset); the real" \
              "worker is generated at publish/deploy/build, never committed (#582)."
            exit 1
          fi
      - run: flutter pub get
      - name: Compile the bundled web render worker (output discarded)
        run: |
          dart run dart_pdf_editor:build_web_worker \
            --out "${RUNNER_TEMP}/pdf_render_worker.dart.js"

  # Build the Linux desktop target and validate its desktop-integration files.
  # Mirrors the release-app.yml linux job's build deps (GTK + libsecret for
  # flutter_secure_storage; libjsoncpp for the desktop_drop/secure_storage
  # toolchain) and adds desktop-file/AppStream validation plus a headless
  # smoke launch under Xvfb. Kept green so `flutter build linux` can't rot.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build + validation deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev \
            desktop-file-utils appstream xvfb x11-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux (release)
        working-directory: app
        run: flutter build linux --release
      - name: Validate .desktop entry
        run: desktop-file-validate app/linux/dev.milanko.dartpdf.desktop
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net app/linux/dev.milanko.dartpdf.metainfo.xml
      - name: Confirm desktop files landed in the bundle
        working-directory: app
        run: |
          set -euo pipefail
          bundle=build/linux/x64/release/bundle
          test -f "$bundle/share/applications/dev.milanko.dartpdf.desktop"
          test -f "$bundle/share/metainfo/dev.milanko.dartpdf.metainfo.xml"
          for sz in 64 128 256 512; do
            test -f "$bundle/share/icons/hicolor/${sz}x${sz}/apps/dev.milanko.dartpdf.png"
          done
      - name: Smoke launch GUI under Xvfb
        working-directory: app
        run: |
          ../tool/smoke_test_linux_gui.sh \
            --cmd "build/linux/x64/release/bundle/dart_pdf_editor_app" \
            --timeout 15

  # Static validation of the Microsoft Store packaging scripts. The real
  # submission needs a Windows runner and Partner Center credentials
  # (release-windows-store.yml), so this keeps the PowerShell and the
  # `msix_config` block from rotting without paying for either. `pwsh` is
  # preinstalled on ubuntu-latest.
  windows-store-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse-check the packaging PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem app/packaging/msstore -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Host "::error file=app/packaging/msstore/$($_.Extent.File | Split-Path -Leaf),line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
            } else {
              Write-Host "OK $($_.Name)"
            }
          }
          if ($failed) { exit 1 }
      - name: Check the Store MSIX config stays complete
        shell: pwsh
        run: |
          $pubspec = Get-Content app/pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^msix_config:') {
            Write-Host '::error::app/pubspec.yaml lost its msix_config block'
            exit 1
          }
          # `store` true is what makes msix skip signing; a signed package is
          # rejected by the Store, so losing it silently breaks submissions.
          # Anchor to the real YAML key - the prose comments in pubspec.yaml
          # mention these settings by name, so a substring match would pass
          # even with the key flipped or deleted.
          $required = @{
            'store'          = '(?m)^\s+store:\s*true\s*$'
            'file_extension' = '(?m)^\s+file_extension:\s*\.pdf\s*$'
            'architecture'   = '(?m)^\s+architecture:\s*x64\s*$'
          }
          foreach ($key in $required.Keys) {
            if ($pubspec -notmatch $required[$key]) {
              Write-Host "::error::app/pubspec.yaml msix_config is missing or changed '$key'"
              exit 1
            }
          }
          # The identity values must NOT be checked in - they are account
          # specific and a stale copy builds a package the Store refuses.
          foreach ($key in @('identity_name:', 'publisher:', 'publisher_display_name:')) {
            if ($pubspec -match "(?m)^\s+$([regex]::Escape($key))") {
              Write-Host "::error::app/pubspec.yaml pins '$key' - pass it via build-msix.ps1 env instead"
              exit 1
            }
          }
          Write-Host 'msix_config OK'
