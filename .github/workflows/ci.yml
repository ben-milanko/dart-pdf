name: CI

on:
  push:
    branches: [main, deploy]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      # Enforce the lockstep versioning invariant: every workspace package
      # must depend on its siblings at the current release version (`^x.y.z`).
      # A stale lower bound makes pub.dev's downgrade analysis fail (0/20 on
      # "compatible with dependency constraint lower bounds"). See the script
      # header and dart.dev/go/downgrade-testing.
      - name: Check lockstep dependency lower bounds
        run: dart run tool/check_lockstep_constraints.dart
      # Every non-English ARB must have 100% key coverage against its _en.arb
      # template. gen-l10n silently falls back to English for missing keys, so
      # a half-translated locale would otherwise ship looking finished. See
      # tool/check_arb_coverage.dart and doc/i18n.md.
      - name: Check ARB translation coverage
        run: dart run tool/check_arb_coverage.dart
      # Deterministic perf counter gate: structural work counters (objects
      # loaded, bytes decoded, content ops, ...) over fixed inputs vs the
      # committed baseline. No wall time, so a noisy shared runner cannot
      # flake it. Re-baseline deliberately with
      # `tool/perf.sh gate --update-baseline`.
      - name: Perf counter gate
        working-directory: packages/pdf_graphics
        run: dart run tool/perf_count_gate.dart
      # Prove the PdfPerf facade's kill switch still dead-code-eliminates:
      # -DPDF_PERF=false must strip the marker from compiled JS.
      - name: Perf facade DCE check
        run: tool/check_perf_dce.sh
      - name: Activate coverage tool
        run: dart pub global activate coverage

      - name: Test pdf_cos
        working-directory: packages/pdf_cos
        run: |
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --packages=../../.dart_tool/package_config.json
      - name: Upload pdf_cos coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/pdf_cos/coverage/lcov.info
          flags: pdf_cos
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test pdf_document
        working-directory: packages/pdf_document
        run: |
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --packages=../../.dart_tool/package_config.json
      - name: Upload pdf_document coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/pdf_document/coverage/lcov.info
          flags: pdf_document
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test pdf_graphics
        working-directory: packages/pdf_graphics
        run: |
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --packages=../../.dart_tool/package_config.json
      - name: Upload pdf_graphics coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/pdf_graphics/coverage/lcov.info
          flags: pdf_graphics
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test dart_pdf_editor
        working-directory: packages/dart_pdf_editor
        run: flutter test --coverage
      - name: Upload dart_pdf_editor coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/dart_pdf_editor/coverage/lcov.info
          flags: dart_pdf_editor
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test pdf_ocr_vlm
        working-directory: packages/pdf_ocr_vlm
        run: flutter test --coverage
      - name: Upload pdf_ocr_vlm coverage
        uses: codecov/codecov-action@v7
        with:
          files: packages/pdf_ocr_vlm/coverage/lcov.info
          flags: pdf_ocr_vlm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Test DartPDF app
        working-directory: app
        run: flutter test --coverage
      - name: Upload app coverage
        uses: codecov/codecov-action@v7
        with:
          files: app/coverage/lcov.info
          flags: app
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The real bundled web render worker
  # (`packages/dart_pdf_editor_assets/assets/web/pdf_render_worker.dart.js`) is a
  # ~1 MB `dart compile js` artifact that is NO LONGER committed (issue #582):
  # only a small stable placeholder is checked in (so the declared Flutter asset
  # always exists for analyze + every native/web build), and the real bundle is
  # regenerated over it at publish (tool/release.sh), at every web deploy/
  # preview/release, and for local web builds (app/tool/build_web.sh). There is
  # therefore nothing to keep in sync, and the old regenerate-and-push machinery
  # (issues #411/#422: the concurrency group, tool/ci/regen_web_worker.sh, and
  # WORKER_REGEN_TOKEN) is gone. This job keeps that machinery's one real value -
  # proving the worker still COMPILES, catching `.toJS`-conversion / dart2js
  # errors `dart analyze` misses (async message handlers) - and guards that the
  # committed file stays the placeholder, so the real blob is never re-committed.
  worker-compiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      # Guard: the checked-in worker asset must stay the small placeholder, not
      # a committed ~1 MB build (the whole point of #582). 8 KB is far above the
      # ~1.5 KB placeholder and far below the ~1 MB real bundle.
      - name: Guard the committed worker stays a placeholder
        run: |
          asset=packages/dart_pdf_editor_assets/assets/web/pdf_render_worker.dart.js
          size=$(wc -c < "$asset")
          echo "committed worker placeholder is ${size} bytes"
          if [ "$size" -gt 8192 ]; then
            echo "::error::$asset is ${size} bytes - the real dart2js bundle was" \
              "committed. Restore the placeholder (git checkout $asset); the real" \
              "worker is generated at publish/deploy/build, never committed (#582)."
            exit 1
          fi
      - run: flutter pub get
      - name: Compile the bundled web render worker (output discarded)
        run: |
          dart run dart_pdf_editor:build_web_worker \
            --out "${RUNNER_TEMP}/pdf_render_worker.dart.js"

  # Build the Linux desktop target and validate its desktop-integration files.
  # Mirrors the release-app.yml linux job's build deps (GTK + libsecret for
  # flutter_secure_storage; libjsoncpp for the desktop_drop/secure_storage
  # toolchain) and adds desktop-file/AppStream validation plus a headless
  # smoke launch under Xvfb. Kept green so `flutter build linux` can't rot.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build + validation deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev \
            desktop-file-utils appstream xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux (release)
        working-directory: app
        run: flutter build linux --release
      - name: Validate .desktop entry
        run: desktop-file-validate app/linux/dev.milanko.dartpdf.desktop
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net app/linux/dev.milanko.dartpdf.metainfo.xml
      - name: Confirm desktop files landed in the bundle
        working-directory: app
        run: |
          set -euo pipefail
          bundle=build/linux/x64/release/bundle
          test -f "$bundle/share/applications/dev.milanko.dartpdf.desktop"
          test -f "$bundle/share/metainfo/dev.milanko.dartpdf.metainfo.xml"
          for sz in 64 128 256 512; do
            test -f "$bundle/share/icons/hicolor/${sz}x${sz}/apps/dev.milanko.dartpdf.png"
          done
      # Headless smoke launch: catch immediate startup crashes (plugin
      # registration, a missing .so) that a compile can't. Non-blocking - a GUI
      # under Xvfb can be flaky in CI, so a launch failure warns rather than
      # fails the job. Surviving ~8s without exiting is treated as success.
      - name: Smoke launch under Xvfb (non-blocking)
        working-directory: app
        continue-on-error: true
        run: |
          set -uo pipefail
          bin=build/linux/x64/release/bundle/dart_pdf_editor_app
          xvfb-run -a "$bin" >/tmp/dartpdf-smoke.log 2>&1 &
          pid=$!
          sleep 8
          if kill -0 "$pid" 2>/dev/null; then
            echo "App still running after 8s - startup OK."
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          else
            echo "::warning::App exited within 8s during headless smoke launch."
            cat /tmp/dartpdf-smoke.log || true
            exit 1
          fi
