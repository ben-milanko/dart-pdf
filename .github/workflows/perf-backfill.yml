name: perf-backfill

# One-shot (workflow_dispatch) backfill of the perf trend for OLD commits that
# predate the perf harness (PR #356). tool/perf/backfill.sh grafts the current
# harness onto each ref and runs the CI-safe ghent-suite-open sweep (the ghent
# corpus is byte-identical from 1.3.0 on). Running every ref in ONE job on ONE
# runner keeps the numbers mutually comparable and comparable to the CI nightly
# points, then appends them (deduped by sha+scenario) to the perf-data history
# and rebuilds the dashboard - same target as perf-nightly.

on:
  workflow_dispatch:
    inputs:
      refs:
        description: 'Space-separated refs/tags to backfill'
        required: false
        default: 'app-v1.3.0 app-v1.4.0 app-v1.4.6 app-v1.4.7'

permissions:
  contents: write

# Share the nightly's group so the two never push perf-data concurrently.
concurrency:
  group: perf-nightly
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # backfill worktrees historical commits + needs tags

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Fetch perf-data history branch
        run: git fetch origin perf-data:perf-data 2>/dev/null || echo "no perf-data branch yet"

      - name: VM-sweep backfill (parse/interpret + peak RSS)
        run: tool/perf/backfill.sh out/perf-history ${{ github.event.inputs.refs }}

      - name: Render backfill (rasterize - paint + image decode)
        run: tool/perf/render_backfill.sh out/perf-history ${{ github.event.inputs.refs }}

      # Progressive first-paint is a 2.0.0+ capability (PdfDocument.openSource),
      # so it isn't backfilled - measured once at the workflow's HEAD (the heavy
      # docs were generated by the backfill steps above).
      - name: Progressive first-paint (2.0.0+, not backfilled)
        run: |
          cd packages/pdf_graphics
          PDF_PROGRESSIVE_SCENARIO=progressive-cad \
          PDF_PROGRESSIVE_APPEND_HISTORY="$GITHUB_WORKSPACE/out/perf-history/progressive-open.ndjson" \
            dart run tool/bench_progressive_open.dart \
              ../../tool/perf/cache/cad-138-6000-20260718.pdf 3

      - name: Append (deduped) + rebuild dashboard on perf-data
        run: |
          git config user.name "perf-backfill"
          git config user.email "perf-backfill@users.noreply.github.com"
          if git rev-parse -q --verify perf-data >/dev/null; then
            git worktree add ../perf-data perf-data
          else
            git worktree add --detach ../perf-data
            (cd ../perf-data && git checkout --orphan perf-data && git rm -rf -q . || true)
          fi
          mkdir -p ../perf-data/history
          # Idempotent append: skips (rev.sha, scenario) already present.
          python3 tool/perf/merge_backfill.py out/perf-history ../perf-data/history
          node tool/perf/report/build_report.mjs \
            --history ../perf-data/history \
            --targets tool/perf/targets.json \
            --out ../perf-data/index.html
          cd ../perf-data
          git add -A
          if git diff --cached --quiet; then
            echo "no new backfill points; nothing to commit"
          else
            git commit -m "perf-backfill: $(date -u +%F) refs=[${{ github.event.inputs.refs }}]"
            git push origin HEAD:perf-data
          fi
