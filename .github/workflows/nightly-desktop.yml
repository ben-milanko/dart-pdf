name: Nightly desktop builds

# Publishes one rolling, unsigned Windows + macOS prerelease from main. The
# release body records the last successfully published commit, so the desktop
# runners are only started when main has moved since that build. Both
# platforms must build for the release to move, so every asset on the rolling
# prerelease always comes from the same commit.
on:
  schedule:
    # 02:20 AEST / 03:20 AEDT.
    - cron: '20 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-desktop
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.5'
  NIGHTLY_TAG: app-nightly

jobs:
  changes:
    name: Check for changes on main
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
      head_sha: ${{ steps.changes.outputs.head_sha }}
      previous_sha: ${{ steps.changes.outputs.previous_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Compare main with the last successful nightly
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"
          release_body="$(gh release view "$NIGHTLY_TAG" --json body --jq .body 2>/dev/null || true)"
          previous_sha="$(
            printf '%s\n' "$release_body" |
              sed -nE 's/.*<!-- main-sha: ([0-9a-f]{40}) -->.*/\1/p' |
              head -n 1
          )"

          should_build=true
          if [[ "$previous_sha" == "$head_sha" ]]; then
            should_build=false
            echo "No changes on main since the last successful nightly ($head_sha)." \
              >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$previous_sha" ]]; then
            echo "main moved from $previous_sha to $head_sha; starting a nightly build." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No successful nightly marker exists; starting the first build at $head_sha." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows app
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows release
        working-directory: app
        shell: pwsh
        run: |
          $versionLine = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value
          $buildName = $versionLine.Split('+')[0]
          flutter build windows --release `
            --build-name="$buildName" `
            --build-number="${{ github.run_number }}" `
            --dart-define="PDF_BUILD_COMMIT=${{ needs.changes.outputs.head_sha }}"
          if ($LASTEXITCODE -ne 0) { throw "flutter build windows failed ($LASTEXITCODE)" }
          & build/windows/x64/runner/Release/dartpdf.exe --version
          if ($LASTEXITCODE -ne 0) { throw "dartpdf.exe smoke check failed ($LASTEXITCODE)" }

      - name: Package portable build
        working-directory: app
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          Copy-Item "$env:SystemRoot\System32\msvcp140.dll",
                    "$env:SystemRoot\System32\vcruntime140.dll",
                    "$env:SystemRoot\System32\vcruntime140_1.dll" `
                    -Destination $bundle -Force

          $archive = "dartpdf-nightly-windows-x64.zip"
          Compress-Archive -Path "$bundle/*" -DestinationPath $archive -Force

      - name: Build Windows installer
        working-directory: app
        shell: pwsh
        run: |
          $versionLine = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value
          $buildName = $versionLine.Split('+')[0]
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress | Out-Null
          }
          ./packaging/windows/build-installer.ps1 `
            -BundlePath build/windows/x64/runner/Release `
            -Version $buildName `
            -OutputPath dartpdf-nightly-windows-installer.exe

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-windows
          path: |
            app/dartpdf-nightly-windows-installer.exe
            app/dartpdf-nightly-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  macos_cli:
    name: Build macOS CLI (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compile native CLI/MCP slice
        run: |
          dart tool/build_desktop_cli.dart \
            --output app/build/dartpdf-cli/dartpdf-${{ matrix.arch }} \
            --target-os macos \
            --target-arch ${{ matrix.arch }}
          file app/build/dartpdf-cli/dartpdf-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-macos-cli-${{ matrix.arch }}
          path: app/build/dartpdf-cli/dartpdf-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Build macOS app
    needs: [changes, macos_cli]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Neutralize code signing for the unsigned CI build (runner-only)
        working-directory: app
        # Same runner-only patch as release-app.yml: the committed pbxproj
        # carries Automatic signing + the team for local App Store archives,
        # while CI has no Apple account and produces an ad-hoc DMG.
        run: |
          sed -i '' \
            -e 's/"Apple Development"/"-"/g' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/DEVELOPMENT_TEAM = N5K9GK8B27;/DEVELOPMENT_TEAM = "";/g' \
            macos/Runner.xcodeproj/project.pbxproj

      - name: Build macOS release
        working-directory: app
        env:
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
        run: |
          set -euo pipefail
          build_name="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          flutter build macos --release \
            --build-name="$build_name" \
            --build-number="${{ github.run_number }}" \
            --dart-define="PDF_BUILD_COMMIT=$HEAD_SHA"

      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-macos-cli-*
          path: app/build/dartpdf-cli-slices
          merge-multiple: true

      - name: Install universal CLI/MCP sidecar
        working-directory: app
        run: |
          set -euo pipefail
          sidecar=build/macos/Build/Products/Release/DartPDF.app/Contents/MacOS/dartpdf-cli
          /usr/bin/lipo -create \
            build/dartpdf-cli-slices/dartpdf-arm64 \
            build/dartpdf-cli-slices/dartpdf-x64 \
            -output "$sidecar"
          chmod 755 "$sidecar"
          /usr/bin/lipo -info "$sidecar"
          "$sidecar" --version

      - name: Ad-hoc sign macOS app with distributable entitlements
        working-directory: app
        env:
          CODESIGN_ENTITLEMENTS: macos/Runner/AdHoc.entitlements
        run: bash macos/resign_embedded_code.sh build/macos/Build/Products/Release/DartPDF.app

      - name: Smoke-test macOS app launch
        working-directory: app
        # A startup crash (plugin registration, missing dylib) exits the
        # process immediately; require the app to survive the window.
        run: |
          set -euo pipefail
          bin="build/macos/Build/Products/Release/DartPDF.app/Contents/MacOS/DartPDF"
          "$bin" >"$RUNNER_TEMP/dartpdf-macos-smoke.log" 2>&1 &
          pid=$!
          sleep 12
          if kill -0 "$pid" 2>/dev/null; then
            echo "App still running after 12s - startup OK."
            kill "$pid" 2>/dev/null || true
          else
            status=0
            wait "$pid" || status=$?
            cat "$RUNNER_TEMP/dartpdf-macos-smoke.log" || true
            echo "macOS app exited during smoke launch (status $status)" >&2
            exit 1
          fi

      - name: Package DMG
        working-directory: app
        run: |
          set -euo pipefail
          rm -rf build/dmg-root
          mkdir -p build/dmg-root
          cp -R build/macos/Build/Products/Release/DartPDF.app build/dmg-root/
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname "DartPDF Nightly" \
            -srcfolder build/dmg-root \
            -ov -format UDZO dartpdf-nightly-macos.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-macos
          path: app/dartpdf-nightly-macos.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish rolling GitHub prerelease
    needs: [changes, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: nightly-windows
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: nightly-macos
          path: artifacts

      - name: Write checksums
        working-directory: artifacts
        run: |
          sha256sum \
            dartpdf-nightly-macos.dmg \
            dartpdf-nightly-windows-installer.exe \
            dartpdf-nightly-windows-x64.zip \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build release notes
        id: notes
        env:
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          PREVIOUS_SHA: ${{ needs.changes.outputs.previous_sha }}
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${HEAD_SHA:0:7}"
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          app_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' app/pubspec.yaml)"
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          notes="$RUNNER_TEMP/nightly-notes.md"

          {
            echo "Rolling Windows + macOS test build from [\`$short_sha\`]($repo_url/commit/$HEAD_SHA), built $built_at."
            echo
            echo "- **Windows:** use \`dartpdf-nightly-windows-installer.exe\` to install/update DartPDF, or download the portable ZIP and run \`dart_pdf_editor_app.exe\` from the extracted folder."
            echo "- **macOS:** open \`dartpdf-nightly-macos.dmg\` and drag DartPDF to Applications (universal: Apple silicon + Intel)."
            echo
            echo "> [!WARNING]"
            echo "> These CI builds are not distribution-signed. Windows may show a SmartScreen warning; on macOS the app is ad-hoc signed and not notarized, so Gatekeeper blocks the first launch - right-click DartPDF in Applications and choose **Open**, or run \`xattr -dr com.apple.quarantine /Applications/DartPDF.app\`. Neither is a store build."
            echo
            echo "## Changes since the previous nightly"
            echo

            if [[ -n "$PREVIOUS_SHA" ]] &&
               git merge-base --is-ancestor "$PREVIOUS_SHA" "$HEAD_SHA"; then
              change_count="$(git rev-list --count "$PREVIOUS_SHA..$HEAD_SHA")"
              echo "[$change_count commit(s)]($repo_url/compare/$PREVIOUS_SHA...$HEAD_SHA):"
              echo
              git log --max-count=50 \
                --format="- %s ([%h]($repo_url/commit/%H))" \
                "$PREVIOUS_SHA..$HEAD_SHA"
              if (( change_count > 50 )); then
                echo
                echo "_Only the newest 50 commits are shown._"
              fi
            elif [[ -n "$PREVIOUS_SHA" ]]; then
              echo "The history of \`main\` changed since the previous nightly; this build starts a new comparison point."
            else
              echo "Initial nightly build."
            fi

            echo
            echo "<!-- main-sha: $HEAD_SHA -->"
            echo "<!-- app-version: $app_version -->"
          } > "$notes"

          echo "path=$notes" >> "$GITHUB_OUTPUT"
          echo "title=DartPDF nightly - $(date -u +%Y-%m-%d) ($short_sha)" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail

          # Move the stable nightly tag only after the build has succeeded.
          # The release-body SHA marker is written last, after all assets have
          # uploaded; a partial publish is therefore retried on the next run.
          git tag -f "$NIGHTLY_TAG" "$HEAD_SHA"
          git push --force origin "refs/tags/$NIGHTLY_TAG:refs/tags/$NIGHTLY_TAG"

          if ! gh release view "$NIGHTLY_TAG" >/dev/null 2>&1; then
            gh release create "$NIGHTLY_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "Nightly assets are being uploaded." \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

          gh release upload "$NIGHTLY_TAG" \
            artifacts/dartpdf-nightly-windows-installer.exe \
            artifacts/dartpdf-nightly-windows-x64.zip \
            artifacts/dartpdf-nightly-macos.dmg \
            artifacts/SHA256SUMS.txt \
            --clobber

          gh release edit "$NIGHTLY_TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_PATH" \
            --prerelease \
            --verify-tag
