# Per-package coverage flags for the dart-pdf workspace. Each package's tests
# upload under its own flag (see .github/workflows/ci.yml), so the README
# coverage badges can be scoped per package.
flag_management:
  default_rules:
    carryforward: true

flags:
  pdf_cos:
    paths:
      - packages/pdf_cos/lib
  pdf_document:
    paths:
      - packages/pdf_document/lib
  pdf_graphics:
    paths:
      - packages/pdf_graphics/lib
  dart_pdf_editor:
    paths:
      - packages/dart_pdf_editor/lib
  pdf_ocr_vlm:
    paths:
      - packages/pdf_ocr_vlm/lib
  app:
    paths:
      - app/lib

ignore:
  - "**/test/**"
  # gen-l10n output: the generated localization delegate and per-locale string
  # tables (`*_localizations.dart`, `*_localizations_<locale>.dart`). These are
  # code-generated from the ARB files, and translated string getters aren't
  # unit-tested per key - so every new locale would otherwise tank patch
  # coverage with hundreds of untested generated lines. Their correctness is
  # guarded structurally by tool/check_arb_coverage.dart (ARB key parity) plus
  # the l10n wiring tests, not by line coverage of the generated tables.
  - "**/l10n/*_localizations*.dart"
  # Experimental multi-window glue built on Flutter's flag-gated, @internal
  # windowing API. Its windowing branches throw UnsupportedError unless the
  # `windowing` feature flag is on and cannot create real OS windows in the
  # test harness, so they're unreachable in CI by construction. The reachable
  # app-side wiring (app.dart / editor_screen.dart) stays covered.
  - "app/lib/window_support.dart"

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        # New code (the PR diff) must keep meaningful coverage without making
        # UI-only branches fail solely for platform and host-callback glue.
        target: 65%
        # Allow a small slack so trivial diffs don't fail on rounding.
        threshold: 1%
        # Block the PR status when the diff drops below target.
        informational: false

comment:
  layout: "reach, diff, flags, files"
