name: dart_pdf_cli
description: Pure-Dart command line and MCP tools for inspecting PDF documents.
version: 0.2.0
repository: https://github.com/ben-milanko/dart-pdf/tree/main/packages/dart_pdf_cli
issue_tracker: https://github.com/ben-milanko/dart-pdf/issues
topics:
  - pdf
  - cli
  - mcp
  - automation
resolution: workspace

environment:
  sdk: ^3.5.0

executables:
  dartpdf: dartpdf

dependencies:
  args: ^2.7.0
  mcp_dart: ^2.4.1
  path: ^1.9.0
  pdf_cos: ^5.0.0
  pdf_document: ^5.0.0
  pdf_graphics: ^5.0.0

dev_dependencies:
  lints: ^6.1.0
  pdf_test_fixtures: '>=1.4.0 <6.0.0'
  test: ^1.25.0
