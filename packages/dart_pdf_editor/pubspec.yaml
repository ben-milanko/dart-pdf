name: dart_pdf_editor
description: >-
  Flutter PDF editor and viewer for Dart: native rendering, text selection,
  search, annotations, forms, signatures, page editing, and document comparison.
version: 3.8.0
homepage: https://dart-pdf.com/flutter-pdf-editor
repository: https://github.com/ben-milanko/dart-pdf/tree/main/packages/dart_pdf_editor
issue_tracker: https://github.com/ben-milanko/dart-pdf/issues
topics:
  - pdf
  - pdf-viewer
  - pdf-editor
  - annotations
  - forms
resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  archive: ^4.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # ICU message formatting (plurals/select/dates) for the shipped
  # localizations; see lib/l10n/.
  intl: ^0.20.2
  # Keychain/Keystore-backed persistence for signing identities
  # (SecureIdentityStore); the private key never touches shared_preferences.
  flutter_secure_storage: ^11.0.0
  # Cross-platform HTTP client (VM + web via fetch) for the progressive remote
  # PDF byte source (PdfHttpByteSource); uses Range requests, no dart:io in our
  # code. See src/http_byte_source.dart.
  http: ^1.2.0
  image: ^4.9.1
  pdf_cos: ^3.8.0
  pdf_document: ^3.8.0
  pdf_graphics: ^3.8.0
  shared_preferences: ^2.3.0
  # Opens hyperlink (/URI) actions the viewer follows itself; see
  # PdfViewer.onLaunchUrl. Web-safe, no dart:io.
  url_launcher: ^6.3.0
  # Web-only: the Web Worker render backend (render_worker_web.dart) talks to a
  # Worker over package:web's typed bindings. A no-op everywhere else.
  web: ^1.1.0

dev_dependencies:
  pdf_test_fixtures: '>=1.4.0 <4.0.0'
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Stub the url_launcher platform channel in the hyperlink-launch tests so
  # they exercise the default launcher without a real platform binding.
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

flutter:
  generate: true
  # The editor fonts and the prebuilt web render worker are NOT declared here.
  # They live in the optional companion package `dart_pdf_editor_assets`, so a
  # viewer-only app never bundles their ~1.7 MB: Flutter includes a package's
  # declared assets on every build target, so keeping them in a separate
  # package is the only way to make them opt-in. Depend on that package and call
  # `registerBundledEditorAssets()` to restore the full-featured defaults.
  #
  # Runtime fragment shaders for the sparse-strip render device (see
  # doc/dev-log) stay here - they are core to rendering, tiny, and not part of
  # the optional editor asset story. flutter_tools compiles these per target;
  # keep them inside the SkSL-safe subset (no dynamic loop bounds, bit ops,
  # texelFetch).
  shaders:
    - shaders/pdf_probe.frag
    - shaders/pdf_strips.frag
    - shaders/pdf_slug.frag
