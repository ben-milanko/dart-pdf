name: pdf_viewer_example
description: Example PDF viewer built on dart_pdf_editor.
version: 3.5.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  pdf_document: ^3.5.0
  pdf_graphics: ^3.5.0
  dart_pdf_editor: ^3.5.0
  dart_pdf_editor_flutter_gpu: ^0.1.0
  # Optional bundled editor fonts + web render worker (registered in main()).
  dart_pdf_editor_assets: ^3.5.0
  pdf_ocr_vlm: ^3.5.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.0
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.3.0

flutter:
  uses-material-design: true
  # Generate the AppLocalizations bundle from lib/l10n (see l10n.yaml); the
  # generated Dart is checked in.
  generate: true
