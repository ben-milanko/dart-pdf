name: pdf_viewer_example
description: Example PDF viewer built on dart_pdf_editor.
version: 1.3.2
publish_to: none
resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  pdf_document: ^1.3.2
  pdf_graphics: ^1.3.2
  dart_pdf_editor: ^1.3.2
  pdf_ocr_vlm: ^1.3.2
  share_plus: ^13.2.0
  url_launcher: ^6.3.0
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.3.0

flutter:
  uses-material-design: true
