<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DartPDF: private, local PDF editor in your browser. Annotate, run OCR, fill forms, add drawn signatures, redact, and compare files without an account.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DartPDF">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Browser chrome matches the splash gradient. -->
  <meta name="theme-color" content="#0169B4">

  <title>DartPDF</title>
  <link rel="manifest" href="manifest.json">

  <!-- Branded loading splash: shown immediately, before Flutter boots, and
       faded out on the first rendered frame so the user never sees a blank
       page on a cold start (the wasm/JS bundle can take a few seconds). -->
  <style>
    #dartpdf-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #16BAFD 0%, #0169B4 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      opacity: 1;
      transition: opacity 0.45s ease;
    }
    #dartpdf-splash.dartpdf-splash--hidden {
      opacity: 0;
      pointer-events: none;
    }
    #dartpdf-splash .dartpdf-splash__mark {
      width: 132px;
      height: 132px;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.28));
      animation: dartpdf-splash-pop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    #dartpdf-splash .dartpdf-splash__title {
      margin-top: 30px;
      color: #ffffff;
      font-size: 27px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }
    #dartpdf-splash .dartpdf-splash__subtitle {
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 14px;
      font-weight: 400;
    }
    #dartpdf-splash .dartpdf-splash__spinner {
      margin-top: 38px;
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: dartpdf-splash-spin 0.9s linear infinite;
    }
    @keyframes dartpdf-splash-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes dartpdf-splash-pop {
      from { transform: scale(0.82); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #dartpdf-splash .dartpdf-splash__mark { animation: none; }
      #dartpdf-splash .dartpdf-splash__spinner { animation-duration: 1.6s; }
    }
    @media (prefers-color-scheme: dark) {
      #dartpdf-splash {
        background: linear-gradient(135deg, #0a4f7a 0%, #042f4d 100%);
      }
    }
  </style>

  <!-- Browser-local OCR bridge: the two network calls of the PP-OCR pipeline.
       Flutter web runs pdf_ocr_ondevice's PpOcrPipeline (resize, normalize,
       box extraction, CTC decoding - the same Dart the native apps run) and
       hands each tensor to __dartPdfOcrRun, which runs it on onnxruntime-web.
       The PP-OCRv5 mobile models (~21 MB) are served from this origin under
       ocr/pp-ocrv5-mobile/ (tool/fetch_ocr_models.sh puts them in the build;
       GitHub release downloads have no CORS) and kept in the Cache API after
       the first use. Page images and OCR results never leave the browser. -->
  <script>
    (function () {
      var ORT_BASE =
        'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/';
      var MODEL_DIR = 'ocr/pp-ocrv5-mobile/';
      var MODEL_CACHE = 'dart-pdf-ocr-pp-ocrv5-mobile-v1';

      // Model-download progress for the app's OCR chip, reported to a Dart
      // listener(stage, loaded, total) registered through
      // __dartPdfOcrOnProgress: 'download' while the two .onnx files arrive
      // (the dictionary is a rounding error), then 'preparing' once while
      // onnxruntime-web fetches its WASM and builds both sessions - which
      // reports nothing itself.
      var progressListener = null;
      window.__dartPdfOcrOnProgress = function (listener) {
        progressListener = listener || null;
      };
      function emitProgress(stage, loaded, total) {
        if (!progressListener) return;
        try {
          progressListener(stage, loaded, total);
        } catch (_) {
          // A progress hiccup must never break the model load.
        }
      }

      // navigator.gpu can exist with no usable adapter behind it (Linux
      // Chrome without GPU access, headless browsers), and asking ONNX Runtime
      // for 'webgpu' there fails outright - so pick the device by whether an
      // adapter actually comes back, not by whether the API is defined.
      async function webGpuAdapter() {
        try {
          return navigator.gpu ? await navigator.gpu.requestAdapter() : null;
        } catch (_) {
          return null;
        }
      }

      // One model file, from the Cache API when an earlier session stored it,
      // else fetched (streamed, for progress) and stored. Same-origin, so a
      // cache that is unavailable (private mode) just means a re-download.
      async function fetchModelFile(url, onBytes) {
        var cache = null;
        try {
          cache = await caches.open(MODEL_CACHE);
          var hit = await cache.match(url);
          if (hit) {
            var cached = await hit.arrayBuffer();
            onBytes(cached.byteLength, cached.byteLength);
            return cached;
          }
        } catch (_) {
          cache = null;
        }
        var response = await fetch(url);
        if (!response.ok) {
          throw new Error('OCR model ' + url + ': HTTP ' + response.status);
        }
        var total = Number(response.headers.get('content-length')) || 0;
        var chunks = [];
        var loaded = 0;
        var reader = response.body.getReader();
        for (;;) {
          var step = await reader.read();
          if (step.done) break;
          chunks.push(step.value);
          loaded += step.value.byteLength;
          onBytes(loaded, Math.max(total, loaded));
        }
        var bytes = new Uint8Array(loaded);
        var offset = 0;
        for (var i = 0; i < chunks.length; i++) {
          bytes.set(chunks[i], offset);
          offset += chunks[i].byteLength;
        }
        if (cache) {
          try {
            await cache.put(url, new Response(bytes.slice().buffer));
          } catch (_) {
            // Quota or private mode: the model still runs, it just isn't kept.
          }
        }
        return bytes.buffer;
      }

      var enginePromise = null;
      function engine() {
        if (!enginePromise) {
          enginePromise = (async function () {
            var adapter = await webGpuAdapter();
            // The WebGPU build is twice the WASM-only one; fetch it only when
            // there is an adapter to use it.
            var ort = await import(ORT_BASE +
              (adapter ? 'ort.webgpu.min.mjs' : 'ort.wasm.min.mjs'));
            ort.env.wasm.wasmPaths = ORT_BASE;
            // Threads need SharedArrayBuffer, i.e. a cross-origin-isolated
            // page (firebase.json's COOP/COEP); elsewhere run single-threaded.
            ort.env.wasm.numThreads = self.crossOriginIsolated ?
              Math.min(4, navigator.hardwareConcurrency || 1) : 1;

            var base = new URL(MODEL_DIR, document.baseURI);
            var names = ['det.onnx', 'rec.onnx'];
            var loaded = [0, 0];
            var totals = [0, 0];
            var models = await Promise.all(names.map(function (name, i) {
              return fetchModelFile(new URL(name, base).href,
                function (l, t) {
                  loaded[i] = l;
                  totals[i] = t;
                  // A file with no size yet would make the fraction jump
                  // backwards once it arrives, so wait for both.
                  if (totals[0] > 0 && totals[1] > 0) {
                    emitProgress('download', loaded[0] + loaded[1],
                      totals[0] + totals[1]);
                  }
                });
            }));
            var dictionary = new TextDecoder().decode(await fetchModelFile(
              new URL('dict.txt', base).href, function () {}));
            emitProgress('preparing', 0, 0);

            var options = {
              executionProviders: adapter ? ['webgpu', 'wasm'] : ['wasm'],
              graphOptimizationLevel: 'all'
            };
            var det = await ort.InferenceSession.create(
              new Uint8Array(models[0]), options);
            var rec = await ort.InferenceSession.create(
              new Uint8Array(models[1]), options);
            return { ort: ort, det: det, rec: rec, dictionary: dictionary };
          })();
          // A failed load (offline, missing models) can be retried.
          enginePromise.catch(function () {
            enginePromise = null;
          });
        }
        return enginePromise;
      }

      // Loads both networks; resolves to the recognizer's dictionary text.
      window.__dartPdfOcrLoad = async function () {
        return (await engine()).dictionary;
      };

      // Runs network `name` ('det' or 'rec') on a float32 NCHW tensor;
      // resolves to { data: Float32Array, dims: number[] }.
      window.__dartPdfOcrRun = async function (name, data, dims) {
        var e = await engine();
        var session = name === 'det' ? e.det : e.rec;
        var input = new e.ort.Tensor('float32', data, dims);
        var feeds = {};
        feeds[session.inputNames[0]] = input;
        var outputs = await session.run(feeds);
        var output = outputs[session.outputNames[0]];
        try {
          return {
            data: await output.getData(),
            dims: Array.from(output.dims)
          };
        } finally {
          input.dispose();
          output.dispose();
        }
      };
    })();
  </script>

  <!-- File Handling API bridge: when the installed PWA is launched to open a
       .pdf, buffer the file(s) until the Dart side registers a consumer, then
       forward each as { name, bytes }. -->
  <script>
    (function () {
      var queued = [];
      var consumer = null;
      window.__dartPdfDrainLaunchFiles = function (cb) {
        consumer = cb;
        queued.forEach(function (e) { cb(e); });
        queued = [];
      };
      if ('launchQueue' in window && 'LaunchParams' in window &&
          'files' in LaunchParams.prototype) {
        window.launchQueue.setConsumer(async function (params) {
          for (const handle of params.files) {
            try {
              const file = await handle.getFile();
              const buf = await file.arrayBuffer();
              const entry = { name: file.name, bytes: new Uint8Array(buf) };
              if (consumer) { consumer(entry); } else { queued.push(entry); }
            } catch (err) { console.error('launch file error', err); }
          }
        });
      }
    })();
  </script>
</head>
<body>
  <!-- Loading splash (removed once Flutter renders its first frame). -->
  <div id="dartpdf-splash" role="status" aria-label="Loading DartPDF">
    <svg class="dartpdf-splash__mark" viewBox="0 0 1024 1024"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="splashBg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#16BAFD"/>
          <stop offset="1" stop-color="#0169B4"/>
        </linearGradient>
        <linearGradient id="splashInk" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#0175C2"/>
          <stop offset="1" stop-color="#13B9FD"/>
        </linearGradient>
      </defs>
      <rect width="1024" height="1024" rx="224" fill="url(#splashBg)"/>
      <path d="M 304 192 H 612 L 752 332 V 800 Q 752 832 720 832 H 304 Q 272 832 272 800 V 224 Q 272 192 304 192 Z"
            fill="#FFFFFF"/>
      <path d="M 612 192 L 752 332 H 646 Q 612 332 612 298 Z" fill="#C6E3F8"/>
      <rect x="332" y="396" width="216" height="34" rx="17" fill="#8FA6B5"/>
      <rect x="332" y="478" width="384" height="40" rx="20" fill="#FFC93C"/>
      <rect x="332" y="566" width="340" height="32" rx="16" fill="#C4D2DC"/>
      <path d="M 330 748 C 384 642 462 642 506 716 C 542 776 584 772 618 718 C 646 674 686 690 702 712"
            fill="none" stroke="url(#splashInk)" stroke-width="32" stroke-linecap="round"/>
    </svg>
    <div class="dartpdf-splash__title">DartPDF</div>
    <div class="dartpdf-splash__subtitle">Loading your PDF workspace…</div>
    <div class="dartpdf-splash__spinner"></div>
  </div>
  <script>
    (function () {
      function hideSplash() {
        var s = document.getElementById('dartpdf-splash');
        if (!s) return;
        s.classList.add('dartpdf-splash--hidden');
        window.setTimeout(function () {
          if (s && s.parentNode) s.parentNode.removeChild(s);
        }, 500);
      }
      // Flutter dispatches this on the document once the first frame paints.
      window.addEventListener('flutter-first-frame', hideSplash);
      // Safety net: never leave the splash up if the event is missed.
      window.setTimeout(hideSplash, 15000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
