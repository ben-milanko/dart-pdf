arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# Deferred loading is deliberately OFF - see the note in
# packages/dart_pdf_editor/l10n.yaml and doc/i18n.md. With it on, a runtime
# language switch only takes effect once the locale's library loads
# asynchronously (a network chunk fetch on web), so the picker appears to do
# nothing; synchronous loading keeps the switch instant. tool/trim_locales.sh
# controls which locales a release build compiles.
use-deferred-loading: false
# Flutter 3.50 deprecates flutter_localizations' GlobalMaterialLocalizations /
# GlobalCupertinoLocalizations (moved to material_ui / cupertino_ui), but
# gen-l10n still emits them in `localizationsDelegates`. The generated code is
# the tool's to migrate, so silence the info rather than hand-edit the output.
header: "// ignore_for_file: deprecated_member_use"
