name: dart_pdf_editor_app
description: "DartPDF - a fully native Flutter PDF editor"
publish_to: 'none'
resolution: workspace

# version is the single source of truth for every platform build; CI passes
# --build-name / --build-number derived from it (see app/RELEASING.md).
version: 1.4.7+17

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # The PDF engine and editing UI live in the workspace packages.
  dart_pdf_editor: ^1.4.7
  pdf_document: ^1.4.7
  pdf_cos: ^1.4.7

  # On-device, downloadable OCR - adds a selectable text layer over scans
  # without leaving the device (native platforms only).
  pdf_ocr_ondevice: ^1.4.7

  # Cross-platform file I/O and OS integration.
  file_selector: ^1.0.3
  share_plus: ^13.2.0
  url_launcher: ^6.3.0
  # Printing has no third-party PDF engine. Where the OS can print a PDF
  # natively (iOS/macOS via CoreGraphics, Android via PrintManager, the browser
  # on web) the document's own vector content is handed straight over - crisp
  # and selectable. Windows and Linux have no native PDF-print API, so there we
  # render each page with our own engine and stream a raster. This drops the
  # `printing` plugin, whose desktop backend crashed on some of our
  # broken-but-renderable inputs via its bundled PDFium (see lib/printing.dart,
  # lib/native_print*.dart, and the per-platform runners).
  shared_preferences: ^2.3.0
  # Snapshots mobile picks into the app's private store so Recent entries and
  # the last session can be reopened without a fresh pick (see pdf_cache.dart).
  path_provider: ^2.1.6
  # Content-addresses those snapshots so reopening the same PDF reuses one file.
  crypto: ^3.0.0
  desktop_drop: ^0.7.0
  # Polls GitHub Releases for a newer build (in-app update checker). Works on
  # the web build too, though the updater skips the check there.
  http: ^1.2.0
  # Reads the version stamped into the build artifact (derived from the
  # pubspec version above), so the About box can't drift from the release.
  package_info_plus: ^10.2.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only used by tool/screenshots_main.dart (not by lib/) to borrow the
  # example's feature-showcase document for marketing screenshots.
  pdf_viewer_example:
    path: ../packages/dart_pdf_editor/example

  # Programmatically-built PDFs for widget tests.
  pdf_test_fixtures: ^1.4.7

  # Text extraction, used by the on-device OCR integration test to assert
  # the recognized layer is selectable (pdf_ocr_ondevice is a runtime dep).
  pdf_graphics: ^1.4.7
  file_selector_platform_interface: ^2.7.0

flutter:
  uses-material-design: true
  assets:
    - web/favicon.png
    - web/icons/Icon-512.png
